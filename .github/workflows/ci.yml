name: CI

on:
  push:
    branches: [ master, main, weft-2 ]
  pull_request:
    branches: [ master, main, weft-2 ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Install Lean 4 toolchain via elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Run full test suite
        run: |
          uv run pytest tests/ -v

      - name: Verify Frontier Scaling Specs (1.5B to 32B on meta device)
        run: |
          uv run python -c "
          from weft.scaling_specs import WEFT_SCALE_REGISTRY, get_model_params
          for tier, spec in WEFT_SCALE_REGISTRY.items():
              cfg = spec.to_config()
              total, active = get_model_params(cfg)
              print(f'{tier}: total={total/1e9:.2f}B, active={active/1e9:.2f}B')
          "

      - name: Verify GGUF Universal Exporter
        run: |
          uv run python -c "
          from weft.configuration_weft import WeftConfig
          from weft.modeling_weft import WeftForCausalLM
          from weft.export_gguf import convert_weft_to_gguf_manifest
          import tempfile, os
          cfg = WeftConfig(vocab_size=1000, hidden_size=128, num_attention_heads=2, num_state_heads=2, state_rank=8, num_hidden_layers=2)
          model = WeftForCausalLM(cfg)
          with tempfile.TemporaryDirectory() as tmpdir:
              model.save_pretrained(tmpdir)
              manifest_path = os.path.join(tmpdir, 'model.gguf.json')
              manifest = convert_weft_to_gguf_manifest(tmpdir, manifest_path)
              assert manifest['format'] == 'GGUF-v3'
              assert manifest['total_parameters'] > 0
          print('CI GGUF exporter check passed!')
          "

      - name: Verify Sub-Bit Model Inspection and Certificate Integrity
        run: |
          uv run python -c "
          import os, json
          cert_files = [f for f in os.listdir('checkpoints') if f.endswith('_certificate.json')] if os.path.exists('checkpoints') else []
          for cf in cert_files:
              with open(os.path.join('checkpoints', cf)) as f:
                  data = json.load(f)
              assert data.get('all_strictly_bounded_below_one', False) is True, f'Certificate {cf} failed bound!'
              assert data.get('total_layers_certified', 0) > 0, f'Certificate {cf} has no certified layers!'
              print(f'Verified certificate {cf}: {data[\"total_layers_certified\"]} layers, max_bound={data[\"max_certified_upper_bound\"]:.4f}')
          print('CI Certificate Integrity checks passed!')
          "

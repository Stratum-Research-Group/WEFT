rted : StopSignalActionState\n  deriving Repr, DecidableEq\n\n/-- State representation of a hyperdirect motor braking loop:\n    `stopSignal`: Cortical rIFC / pre-SMA stop drive (scaled as Nat)\n    `stnBaseRate`: Spontaneous baseline discharge of STN neurons (Hz)\n    `stnGain`: Gain of monosynaptic corticosubthalamic drive\n    `gpiBaseRate`: Baseline GPi/SNr tonic inhibitory discharge (Hz)\n    `gpiGain`: Firing rate amplification from STN to GPi\n    `abortThreshold`: GPi discharge rate required to cancel motor execution (Hz)\n-/\nstructure HyperdirectBrakeState where\n  stopSignal : Nat\n  stnBaseRate : Nat\n  stnGain : Nat\n  gpiBaseRate : Nat\n  gpiGain : Nat\n  abortThreshold : Nat\n  h_stn_gain_pos : stnGain > 0\n  h_gpi_gain_pos : gpiGain > 0\n  h_base_lt_thresh : gpiBaseRate < abortThreshold\n  deriving Repr\n\n/-- Compute STN hyperdirect firing rate: stnBaseRate + stnGain * stopSignal. -/\ndef computeSTNRate (s : HyperdirectBrakeState) : Nat :=\n  s.stnBaseRate + s.stnGain * s.stopSignal\n\n/-- Compute GPi pallidal inhibitory output rate: gpiBaseRate + gpiGain * (stnRate - stnBaseRate). -/\ndef computeGPiRate (s : HyperdirectBrakeState) : Nat :=\n  s.gpiBaseRate + s.gpiGain * (s.stnGain * s.stopSignal)\n\n/-- Evaluate action cancellation state. -/\ndef evaluateActionState (s : HyperdirectBrakeState) : StopSignalActionState :=\n  if computeGPiRate s >= s.abortThreshold then\n    StopSignalActionState.actionAborted\n  else\n    StopSignalActionState.actionExecuted\n\n/-- Cancellation predicate: Is the ongoing motor program aborted? -/\ndef isMotorAborted (s : HyperdirectBrakeState) : Prop :=\n  computeGPiRate s >= s.abortThreshold\n\n/-- Theorem 1: STN firing rate is strictly monotonic with cortical stop-signal drive. -/\ntheorem stn_rate_monotonic (s : HyperdirectBrakeState) (v1 v2 : Nat)\n    (h_le : v1 <= v2) :\n    let s1 : HyperdirectBrakeState := { s with stopSignal := v1 }\n    let s2 : HyperdirectBrakeState := { s with stopSignal := v2 }\n    computeSTNRate s1 <= computeSTNRate s2 := by", "figure_1_png": "docs/figures/figure_paper_183.png", "figure_1_svg": "docs/figures/figure_paper_183.svg", "figure_2_png": "docs/figures/figure_paper_183_validation.png", "figure_2_svg": "docs/figures/figure_paper_183_validation.svg"}, {"paper_number": 184, "target_number": 375, "title": "Posterior Parietal Cortex (Area 5d / 7a) Multimodal Coordinate Transformations, Eye-Position Gain Fields, and Hand-Centered Invariant Reach Vector Extraction", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #375: ParietoFrontalCoordinateTransformInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Voluntary reaching movements require mapping visual target locations acquired in a retinotopic frame of reference into hand-centered motor error vectors appropriate for descending corticospinal motor execution. Neurons in the posterior parietal cortex (PPC)\u2014specifically Area 7a and the lateral intraparietal area (LIP)\u2014exhibit retinotopic receptive fields that are multiplicatively modulated by eye position, forming planar \"gain fields.\" Downstream in the medial intraparietal area (MIP) and dorsal Area 5 (Area 5d), multimodal inputs integrating visual target signals with proprioceptive joint coordinates converge to extract hand-centered displacement vectors ($\\Delta \\mathbf{x} = \\mathbf{x}_{\\text{target, head}} - \\mathbf{x}_{\\text{hand, head}}$). Here, we formalize this coordinate transformation in Lean 4 (Target #375), prove invariant reach vector extraction across compensatory gaze shifts, implement an AVX2-accelerated coordinate transform engine yielding $>1.6\\times 10^9$ conversions per second, and provide an interactive real-time visual HUD in WEFT MSS Void.", "formal_proof": "namespace Weft.Formal\n\n/-- Coordinate reference frame for motor intention:\n    - `retinotopicFrame`: Visual error relative to the fovea.\n    - `headCenteredFrame`: Spatial position relative to head midline.\n    - `handCenteredFrame`: Displacement vector from hand to target.\n-/\ninductive CoordinateFrame where\n  | retinotopicFrame : CoordinateFrame\n  | headCenteredFrame : CoordinateFrame\n  | handCenteredFrame : CoordinateFrame\n  deriving Repr, DecidableEq\n\n/-- State representation of a multimodal parietal coordinate transformation circuit:\n    `retinoTarget`: Retinotopic target position (scaled as Nat, e.g. tenths of degrees)\n    `eyePosition`: Eye-in-head orientation (scaled as Nat)\n    `handPosition`: Hand position in head-centered frame (scaled as Nat)\n    `gainCoeff`: Gain field multiplicative factor\n-/\nstructure ParietalTransformState where\n  retinoTarget : Nat\n  eyePosition : Nat\n  handPosition : Nat\n  gainCoeff : Nat\n  h_gain_pos : gainCoeff > 0\n  deriving Repr\n\n/-- Compute head-centered spatial target position: retinoTarget + eyePosition. -/\ndef computeHeadCenteredTarget (s : ParietalTransformState) : Nat :=\n  s.retinoTarget + s.eyePosition\n\n/-- Compute hand-centered reach vector: Target_head - Hand_head (when Target >= Hand). -/\ndef computeReachVector (s : ParietalTransformState) : Nat :=\n  if computeHeadCenteredTarget s >= s.handPosition then\n    computeHeadCenteredTarget s - s.handPosition\n  else\n    0\n\n/-- Theorem 1: Head-centered target coordinate is strictly monotonic with retinotopic target. -/\ntheorem head_centered_monotonic_with_retino (s : ParietalTransformState) (r1 r2 : Nat)\n    (h_le : r1 <= r2) :\n    let s1 : ParietalTransformState := { s with retinoTarget := r1 }\n    let s2 : ParietalTransformState := { s with retinoTarget := r2 }\n    computeHeadCenteredTarget s1 <= computeHeadCenteredTarget s2 := by", "figure_1_png": "docs/figures/figure_paper_184.png", "figure_1_svg": "docs/figures/figure_paper_184.svg", "figure_2_png": "docs/figures/figure_paper_184_validation.png", "figure_2_svg": "docs/figures/figure_paper_184_validation.svg"}, {"paper_number": 185, "target_number": 376, "title": "Pontomedullary Reticular Formation & Reticulospinal Tract Postural Synergies: Anticipatory Adjustments and Dynamic Equilibrium Invariants", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #376: ReticulospinalSynergyInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Voluntary focal motor behaviors, such as ballistic reaching and manual grasping, exert substantial reactive inertial forces on proximal joints and the bodily center of mass (CoM). Without anticipatory compensatory stabilization, limb acceleration displaces the CoM beyond the base of support (BoS), compromising equilibrium. The pontomedullary reticular formation (PMRF) and its descending reticulospinal tract (RST) mediate anticipatory postural adjustments (APAs) by activating bilateral axial and proximal musculature 50\u2013100 ms prior to distal corticospinal prime-mover recruitment. In this work, we formalize the phase-lead and biomechanical invariance constraints of reticulospinal postural control in Lean 4 (Target #376), present an ultra-low-latency AVX2 vector engine ($>1.8\\times 10^5\\text{ Melem/s}$), provide a high-throughput Triton 3.9 GPU stabilization kernel, and integrate an interactive real-time visual HUD in WEFT MSS Void.", "formal_proof": "namespace Weft.Formal\n\n/-- Postural stability state:\n    `comPosition`: Center of mass displacement from neutral (scaled as Nat, e.g. mm)\n    `bosMargin`: Base of support boundary threshold (scaled as Nat)\n    `pmrfDrive`: Reticulospinal axial drive (scaled as Nat, 0-100)\n    `distalReachOnset`: Timestamp of distal limb motor initiation (ms)\n    `apaOnset`: Timestamp of reticulospinal anticipatory postural activation (ms)\n-/\nstructure PosturalSynergyState where\n  comPosition : Nat\n  bosMargin : Nat\n  pmrfDrive : Nat\n  distalReachOnset : Nat\n  apaOnset : Nat\n  h_bos_pos : bosMargin > 0\n  deriving Repr\n\n/-- Compute effective axial stiffness recruited by reticulospinal drive:\n    baseStiffness (30) + (pmrfDrive * stiffnessSlope (2)). -/\ndef computeAxialStiffness (s : PosturalSynergyState) : Nat :=\n  30 + s.pmrfDrive * 2\n\n/-- Predicate for Anticipatory Postural Adjustment (APA) temporal phase-lead:\n    APA activation occurs strictly before distal reach onset by at least leadMargin (ms). -/\ndef hasValidAPALead (s : PosturalSynergyState) (leadMargin : Nat) : Bool :=\n  s.apaOnset + leadMargin <= s.distalReachOnset\n\n/-- Predicate for Center of Mass equilibrium preservation:\n    CoM displacement remains strictly within the Base of Support margin. -/\ndef isEquilibriumPreserved (s : PosturalSynergyState) : Bool :=\n  s.comPosition < s.bosMargin\n\n/-- Theorem 1: Axial stiffness increases monotonically with PMRF reticulospinal drive. -/\ntheorem axial_stiffness_monotonic (s : PosturalSynergyState) (d1 d2 : Nat)\n    (h_le : d1 <= d2) :\n    let s1 : PosturalSynergyState := { s with pmrfDrive := d1 }\n    let s2 : PosturalSynergyState := { s with pmrfDrive := d2 }\n    computeAxialStiffness s1 <= computeAxialStiffness s2 := by", "figure_1_png": "docs/figures/figure_paper_185.png", "figure_1_svg": "docs/figures/figure_paper_185.svg", "figure_2_png": "docs/figures/figure_paper_185_validation.png", "figure_2_svg": "docs/figures/figure_paper_185_validation.svg"}, {"paper_number": 186, "target_number": 377, "title": "Vestibulo-Ocular Reflex (VOR) Three-Neuron Arc: Semicircular Canal Velocity Transduction and Dynamic Retinal Slip Minimization", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #377: VORPhaseSlipInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Maintaining clear foveal vision during natural head movement requires continuous optical stabilization of images across the photoreceptor mosaic. If head motion induces retinal slip velocities exceeding 2.0\u20132.5 deg/s, dynamic visual acuity degrades precipitously. The horizontal vestibulo-ocular reflex (VOR) mediates optical stabilization with the shortest latency in mammalian motor control (5\u20138 ms) via an elementary three-neuron disynaptic arc: primary vestibular afferents from the semicircular canal ampullae, secondary neurons within the medial vestibular nucleus (MVN), and motor neurons in the abducens (CN VI) and oculomotor (CN III) nuclei. In this paper, we formalize the algebraic and metric invariants of the VOR three-neuron arc in Lean 4 (Target #377), implement an ultra-high-throughput AVX2 SIMD processor achieving $>2.1\\times 10^5\\text{ Melem/s}$, provide a Triton 3.9 fused reflex kernel, and deliver an interactive real-time visual HUD in WEFT MSS Void.", "formal_proof": "namespace Weft.Formal\n\n/-- State of the Vestibulo-Ocular Reflex arc:\n    `headVelocity`: Angular velocity of the head in yaw (scaled as Nat, e.g. tenths of deg/s)\n    `vorGainNumerator`: Gain scaling numerator (e.g. 100 for 1.0)\n    `vorGainDenominator`: Gain scaling denominator (e.g. 100)\n    `maxSlipThreshold`: Maximum allowable retinal slip before visual degradation (scaled Nat)\n-/\nstructure VORState where\n  headVelocity : Nat\n  vorGainNumerator : Nat\n  vorGainDenominator : Nat\n  maxSlipThreshold : Nat\n  h_denom_pos : vorGainDenominator > 0\n  deriving Repr\n\n/-- Compute absolute compensatory eye velocity:\n    (headVelocity * vorGainNumerator) / vorGainDenominator. -/\ndef computeEyeVelocity (s : VORState) : Nat :=\n  (s.headVelocity * s.vorGainNumerator) / s.vorGainDenominator\n\n/-- Compute residual retinal slip magnitude when gain is under-compensating (gain <= 1.0):\n    headVelocity - eyeVelocity. -/\ndef computeRetinalSlip (s : VORState) : Nat :=\n  if s.headVelocity >= computeEyeVelocity s then\n    s.headVelocity - computeEyeVelocity s\n  else\n    0\n\n/-- Predicate for dynamic visual acuity preservation:\n    Retinal slip remains bounded under maxSlipThreshold. -/\ndef isSlipBounded (s : VORState) : Bool :=\n  computeRetinalSlip s <= s.maxSlipThreshold\n\n/-- Theorem 1: Compensatory eye velocity is monotonic with head rotation velocity. -/\ntheorem eye_velocity_monotonic_with_head (s : VORState) (v1 v2 : Nat)\n    (h_le : v1 <= v2) :\n    let s1 : VORState := { s with headVelocity := v1 }\n    let s2 : VORState := { s with headVelocity := v2 }\n    computeEyeVelocity s1 <= computeEyeVelocity s2 := by", "figure_1_png": "docs/figures/figure_paper_186.png", "figure_1_svg": "docs/figures/figure_paper_186.svg", "figure_2_png": "docs/figures/figure_paper_186_validation.png", "figure_2_svg": "docs/figures/figure_paper_186_validation.svg"}, {"paper_number": 187, "target_number": 378, "title": "Cerebellar Flocculus Purkinje Cell Plasticity and Adaptive Vestibulo-Ocular Reflex Gain Calibration", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #378: CerebellarPurkinjeVORAdaptationInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "The open-loop nature of the fast three-neuron vestibulo-ocular reflex (VOR) requires continuous long-term cerebellar calibration to preserve optical image stabilization during ocular maturation, orbital fatigue, or optical alteration (e.g., magnifying or minifying spectacles). Retinal slip occurring during head rotation is detected by the dorsal cap of the inferior olive (IO), which emits low-frequency (1\u20135 Hz) climbing fiber action potentials to the cerebellar flocculus and ventral paraflocculus. Simultaneous conjunctive activation of parallel fibers (carrying head velocity signals from mossy fibers) and climbing fibers induces long-term depression (LTD) at parallel fiber\u2013Purkinje cell (PF-PC) synapses. Reduced Purkinje cell GABAergic inhibition disinhibits secondary vestibular neurons within the medial vestibular nucleus, adaptively increasing compensatory VOR gain toward unity. Here, we formalize the cerebellar plasticity and asymptotic slip convergence invariants in Lean 4 (Target #378), implement an AVX2-accelerated floccular plasticity engine yielding $>3.4\\times 10^9$ plasticity updates per second, develop a Triton 3.9 fused GPU kernel, and integrate an interactive real-time visual HUD into WEFT MSS Void.", "formal_proof": "namespace Weft.Formal\n\n/-- State of cerebellar VOR plasticity circuit:\n    `currentGain`: Current ocular reflex gain (scaled Nat, e.g. 100 = 1.0)\n    `targetGain`: Required optical gain under lenses (scaled Nat)\n    `purkinjeSynapticWeight`: Parallel fiber to Purkinje cell synaptic efficacy (scaled Nat)\n    `climbingFiberError`: Inferior olive retinal slip error magnitude (scaled Nat)\n    `learningRate`: Adaptation increment (scaled Nat)\n-/\nstructure FloccularPlasticityState where\n  currentGain : Nat\n  targetGain : Nat\n  purkinjeSynapticWeight : Nat\n  climbingFiberError : Nat\n  learningRate : Nat\n  deriving Repr\n\n/-- Compute absolute retinal slip error under head rotation speed (normalized to 100):\n    |targetGain - currentGain|. -/\ndef computeSlipError (s : FloccularPlasticityState) : Nat :=\n  if s.targetGain >= s.currentGain then\n    s.targetGain - s.currentGain\n  else\n    s.currentGain - s.targetGain\n\n/-- Adaptive weight update under climbing fiber error:\n    In Purkinje cells, climbing fiber discharge induces LTD (downregulation of PF-Purkinje weight),\n    which disinhibits vestibular nucleus output and increases VOR gain. -/\ndef applyPlasticityStep (s : FloccularPlasticityState) : FloccularPlasticityState :=\n  if s.currentGain < s.targetGain then\n    let gainIncrement := s.learningRate\n    let newGain := s.currentGain + gainIncrement\n    let weightDecrement := if s.purkinjeSynapticWeight >= s.learningRate then s.learningRate else s.purkinjeSynapticWeight\n    { s with\n      currentGain := if newGain <= s.targetGain then newGain else s.targetGain,\n      purkinjeSynapticWeight := s.purkinjeSynapticWeight - weightDecrement,\n      climbingFiberError := if s.targetGain >= newGain then s.targetGain - newGain else 0 }\n  else\n    s\n\n/-- Theorem 1: Under-calibrated VOR gain increases strictly monotonically during adaptation step. -/\ntheorem gain_adaptation_monotonic (s : FloccularPlasticityState)\n    (h_under : s.currentGain < s.targetGain)\n    (h_rate_pos : s.learningRate > 0) :\n    s.currentGain < (applyPlasticityStep s).currentGain := by", "figure_1_png": "docs/figures/figure_paper_187.png", "figure_1_svg": "docs/figures/figure_paper_187.svg", "figure_2_png": "docs/figures/figure_paper_187_validation.png", "figure_2_svg": "docs/figures/figure_paper_187_validation.svg"}, {"paper_number": 188, "target_number": 379, "title": "Superior Colliculus Deep Layers Motor Topography, Omnipause Gating, and Saccadic Burst Generation Kinematics", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #379: SuperiorColliculusGazeHoldInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Primate saccades represent among the fastest orienting movements in animal physiology, attaining peak ocular angular velocities exceeding 800 deg/s. Gaze shifts follow a stereotyped non-linear relationship termed the \"main sequence,\" wherein saccadic duration scales approximately linearly with target amplitude while peak velocity exhibits non-linear exponential saturation. The neural substrate responsible for initiating and shaping horizontal saccades comprises the deep layers of the superior colliculus (SCdl), omnipause neurons (OPNs) of the nucleus raphe interpositus (RIP), and medium-lead burst neurons (EBNs) of the paramedian pontine reticular formation (PPRF). Under baseline conditions, tonic glycinergic discharge from OPNs clamps PPRF burst neurons, preventing premature saccadic trigger. Upon collicular population vector discharge, OPNs are inhibited, disinhibiting PPRF burst neurons whose high-frequency discharge drives the abducens nucleus. In this work, we formalize the omnipause gating and velocity saturation invariants in Lean 4 (Target #379), implement an AVX2-accelerated saccadic burst generator achieving $>3.3\\times 10^9$ kinematic evaluations per second, develop a Triton 3.9 fused kernel, and provide an interactive real-time visual HUD in WEFT MSS Void.", "formal_proof": "namespace Weft.Formal\n\n/-- Saccadic motor generation state:\n    `targetAmplitude`: Desired saccadic gaze displacement in degrees (scaled Nat, e.g. tenths of deg)\n    `opnTonicDrive`: OPN tonic clamping inhibition (scaled Nat, 0-100)\n    `scCollicularDrive`: Superior colliculus population motor vector drive (scaled Nat, 0-100)\n    `baseDuration`: Fixed base duration overhead (scaled Nat, e.g. 20 ms)\n    `durationSlope`: Scaling of duration with amplitude (scaled Nat, e.g. 2 ms per deg)\n-/\nstructure SaccadicGeneratorState where\n  targetAmplitude : Nat\n  opnTonicDrive : Nat\n  scCollicularDrive : Nat\n  baseDuration : Nat\n  durationSlope : Nat\n  deriving Repr\n\n/-- Predicate for OPN pause / disinhibition:\n    OPNs are suppressed when superior colliculus drive strictly exceeds tonic clamp. -/\ndef isOPNPaused (s : SaccadicGeneratorState) : Bool :=\n  s.scCollicularDrive > s.opnTonicDrive\n\n/-- Compute saccadic burst duration in milliseconds:\n    baseDuration + (targetAmplitude * durationSlope). -/\ndef computeSaccadeDuration (s : SaccadicGeneratorState) : Nat :=\n  s.baseDuration + s.targetAmplitude * s.durationSlope\n\n/-- Compute PPRF burst firing rate when un-gated (0 if clamped by OPN).\n    When active: 100 + targetAmplitude * 15 (saturating at 850 spikes/s). -/\ndef computePPRFBurstRate (s : SaccadicGeneratorState) : Nat :=\n  if isOPNPaused s then\n    let raw := 100 + s.targetAmplitude * 15\n    if raw <= 850 then raw else 850\n  else\n    0\n\n/-- Theorem 1: Saccadic duration scales monotonically with target amplitude. -/\ntheorem saccade_duration_monotonic (s : SaccadicGeneratorState) (a1 a2 : Nat)\n    (h_le : a1 <= a2) :\n    let s1 : SaccadicGeneratorState := { s with targetAmplitude := a1 }\n    let s2 : SaccadicGeneratorState := { s with targetAmplitude := a2 }\n    computeSaccadeDuration s1 <= computeSaccadeDuration s2 := by", "figure_1_png": "docs/figures/figure_paper_188.png", "figure_1_svg": "docs/figures/figure_paper_188.svg", "figure_2_png": "docs/figures/figure_paper_188_validation.png", "figure_2_svg": "docs/figures/figure_paper_188_validation.svg"}, {"paper_number": 189, "target_number": 380, "title": "Horizontal Oculomotor Neural Integrator: Velocity-to-Position Transformation, Orbital Viscoelastic Recoil, and Gaze-Holding Drift Invariants", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #380: NeuralIntegratorPulseStepInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Extraocular mechanics dictate that moving and holding the eyeball in eccentric orbital positions are governed by fundamentally distinct physical forces. The orbital tissues act as a viscoelastic medium characterized by significant viscous damping and elastic restoring tension that pulls the eye back toward the primary (straight-ahead) position. Consequently, the brainstem oculomotor system must generate a composite \"pulse-step\" innervational command: a transient high-frequency premotor burst (\"pulse\") to overcome viscous drag, followed by a tonic sustained discharge (\"step\") to counteract elastic recoil. The neural mathematical integration converting velocity pulses into position steps is performed by the horizontal neural integrator, localized within the nucleus prepositus hypoglossi (NPH) and adjacent medial vestibular nucleus (MVN). Here, we formalize the neural integrator invariants in Lean 4 (Target #380), implement an AVX2-accelerated pulse-step processing engine yielding $>3.2\\times 10^5\\text{ Melem/s}$, provide a Triton 3.9 fused GPU kernel, and integrate an interactive real-time visual HUD into WEFT MSS Void.", "formal_proof": "namespace Weft.Formal\n\n/-- State of horizontal oculomotor neural integrator:\n    `gazeAngle`: Horizontal eye eccentricity in degrees (scaled Nat)\n    `tauLeak`: Integrator leak time constant in seconds (scaled Nat)\n    `pulseVelocity`: Transient premotor burst velocity command (scaled Nat)\n    `maxDriftThreshold`: Maximum allowable centripetal drift before nystagmus (scaled Nat)\n-/\nstructure NeuralIntegratorState where\n  gazeAngle : Nat\n  tauLeak : Nat\n  pulseVelocity : Nat\n  maxDriftThreshold : Nat\n  h_tau_pos : tauLeak > 0\n  deriving Repr\n\n/-- Compute step tonic motor firing rate needed to overcome orbital elastic recoil:\n    baseStep (60) + gazeAngle * 4. -/\ndef computeStepTonicFiring (s : NeuralIntegratorState) : Nat :=\n  60 + s.gazeAngle * 4\n\n/-- Compute centripetal gaze-drift velocity: gazeAngle / tauLeak. -/\ndef computeGazeDrift (s : NeuralIntegratorState) : Nat :=\n  s.gazeAngle / s.tauLeak\n\n/-- Predicate for stable gaze holding:\n    Centripetal drift velocity is strictly bounded by maxDriftThreshold. -/\ndef isGazeHoldingStable (s : NeuralIntegratorState) : Bool :=\n  computeGazeDrift s <= s.maxDriftThreshold\n\n/-- Theorem 1: Step tonic firing rate increases monotonically with eccentric gaze angle. -/\ntheorem step_firing_monotonic_with_angle (s : NeuralIntegratorState) (a1 a2 : Nat)\n    (h_le : a1 <= a2) :\n    let s1 : NeuralIntegratorState := { s with gazeAngle := a1 }\n    let s2 : NeuralIntegratorState := { s with gazeAngle := a2 }\n    computeStepTonicFiring s1 <= computeStepTonicFiring s2 := by\n  intro s1 s2\n  dsimp [computeStepTonicFiring, s1, s2]\n  omega\n\n/-- Theorem 2: Ideal infinite time constant eliminates centripetal drift:\n    When tauLeak exceeds gazeAngle (tauLeak > gazeAngle), integer drift is strictly zero. -/\ntheorem long_time_constant_zero_drift (s : NeuralIntegratorState)\n    (h_long : s.gazeAngle < s.tauLeak) :\n    computeGazeDrift s = 0 := by", "figure_1_png": "docs/figures/figure_paper_189.png", "figure_1_svg": "docs/figures/figure_paper_189.svg", "figure_2_png": "docs/figures/figure_paper_189_validation.png", "figure_2_svg": "docs/figures/figure_paper_189_validation.svg"}, {"paper_number": 190, "target_number": 381, "title": "Striatal Dopaminergic D1/D2 Opponent Gating: Three-Factor Synaptic Plasticity, Reward Prediction Errors, and Action Selection Invariants", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #381: StriatalOpponentRPEInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Adaptive voluntary behavior requires the continuous reinforcement of successful actions and the suppression of unrewarding or detrimental motor plans. Within the basal ganglia, the striatum orchestrates action selection through two structurally and neurochemically distinct populations of medium spiny projection neurons (SPNs): direct-pathway spiny projection neurons (dSPNs) expressing low-affinity G$\\alpha_s$-coupled dopamine $D_1$ receptors (\"Go\" pathway), and indirect-pathway spiny projection neurons (iSPNs) expressing high-affinity G$\\alpha_i$-coupled dopamine $D_2$ receptors (\"NoGo\" pathway). Phasic dopaminergic signals originating from midbrain neurons in the substantia nigra pars compacta (SNc) and ventral tegmental area (VTA) encode reward prediction errors (RPEs; $\\delta = r - \\hat{V}$). Positive RPE bursts ($\\delta > 0$) stimulate $D_1$ receptors to induce long-term potentiation (LTP) and simultaneous $D_2$ suppression, promoting action execution. Conversely, reward omissions trigger dopaminergic pauses ($\\delta < 0$), relieving $D_2$ inhibition to recruit indirect-pathway braking and behavioral extinction. Here, we formalize the algebraic and metric invariants of striatal opponent gating in Lean 4 (Target #381), implement an AVX2-accelerated three-factor plasticity engine delivering $>1.2\\times 10^5\\text{ Melem/s}$, provide a Triton 3.9 fused GPU kernel, and deploy an interactive real-time visual HUD into WEFT MSS Void.", "formal_proof": "namespace Weft.Formal\n\n/-- Striatal microcircuit state:\n    `corticalDrive`: Corticostriatal glutamatergic input (scaled Nat, 0-100)\n    `dopamineConcentration`: Striatal dopamine level (scaled Nat, 100 = baseline)\n    `d1Weight`: Synaptic weight of direct pathway dSPNs (scaled Nat)\n    `d2Weight`: Synaptic weight of indirect pathway iSPNs (scaled Nat)\n    `actionThreshold`: Net opponent threshold required for striatofugal disinhibition (scaled Nat)\n-/\nstructure StriatalOpponentState where\n  corticalDrive : Nat\n  dopamineConcentration : Nat\n  d1Weight : Nat\n  d2Weight : Nat\n  actionThreshold : Nat\n  deriving Repr\n\n/-- Compute direct pathway D1 dSPN output firing:\n    (corticalDrive * d1Weight * dopamineConcentration) / 10000. -/\ndef computeD1GoDrive (s : StriatalOpponentState) : Nat :=\n  (s.corticalDrive * s.d1Weight * s.dopamineConcentration) / 10000\n\n/-- Compute indirect pathway D2 iSPN output firing (suppressed by dopamine):\n    When dopamine is elevated above baseline, D2 activity decreases:\n    if dopamineConcentration <= 200 then (corticalDrive * d2Weight * (200 - dopamineConcentration)) / 10000 else 0. -/\ndef computeD2NoGoDrive (s : StriatalOpponentState) : Nat :=\n  if s.dopamineConcentration <= 200 then\n    (s.corticalDrive * s.d2Weight * (200 - s.dopamineConcentration)) / 10000\n  else\n    0\n\n/-- Net opponent striatofugal drive: D1 (Go) - D2 (NoGo) when D1 >= D2. -/\ndef computeNetOpponentDrive (s : StriatalOpponentState) : Nat :=\n  if computeD1GoDrive s >= computeD2NoGoDrive s then\n    computeD1GoDrive s - computeD2NoGoDrive s\n  else\n    0\n\n/-- Predicate for voluntary action selection execution:\n    Net opponent drive strictly exceeds actionThreshold. -/\ndef isActionSelected (s : StriatalOpponentState) : Bool :=\n  computeNetOpponentDrive s >= s.actionThreshold\n\n/-- Theorem 1: Direct D1 \"Go\" drive is strictly monotonic with dopamine concentration. -/\ntheorem d1_go_monotonic_with_dopamine (s : StriatalOpponentState) (da1 da2 : Nat)\n    (h_le : da1 <= da2) :\n    let s1 : StriatalOpponentState := { s with dopamineConcentration := da1 }\n    let s2 : StriatalOpponentState := { s with dopamineConcentration := da2 }\n    computeD1GoDrive s1 <= computeD1GoDrive s2 := by", "figure_1_png": "docs/figures/figure_paper_190.png", "figure_1_svg": "docs/figures/figure_paper_190.svg", "figure_2_png": "docs/figures/figure_paper_190_validation.png", "figure_2_svg": "docs/figures/figure_paper_190_validation.svg"}, {"paper_number": 191, "target_number": 382, "title": "Substantia Nigra Pars Reticulata Output Gating: Striatonigral Pause-Mediated Disinhibition and Thalamocortical Post-Inhibitory Rebound Bursts", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #382: SNrThalamocorticalReboundInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "The basal ganglia exert profound control over movement initiation not through direct excitation, but via a selective disinhibition mechanism. Projection neurons of the substantia nigra pars reticulata (SNr) and internal segment of the globus pallidus (GPi) fire tonically at exceptionally high spontaneous rates (50\u2013100 Hz), delivering continuous GABAergic synaptic inhibition that clamps motor thalamocortical relay cells and brainstem premotor targets. Voluntary movement initiation requires transient silencing of this tonic output. Phasic activation of direct-pathway striatonigral spiny projection neurons (dSPNs) elicits rapid GABAergic suppression of SNr targets, opening a permissive temporal window. This sudden relief from hyperpolarizing inhibition de-inactivates low-threshold voltage-gated T-type calcium channels ($Ca_v3.1 / Ca_v3.2$) in ventromedial (VM) and ventral anterior (VA) motor thalamic neurons, triggering high-frequency post-inhibitory rebound spike bursts that activate primary and premotor cortices. In this work, we formalize the nigrothalamic disinhibition and T-channel rebound burst invariants in Lean 4 (Target #382), implement an AVX2 SIMD disinhibition engine achieving $>1.1\\times 10^5\\text{ Melem/s}$, provide a Triton 3.9 fused GPU kernel, and integrate an interactive real-time visual HUD into WEFT MSS Void.", "formal_proof": "namespace Weft.Formal\n\n/-- Basal ganglia nigrothalamic gate state:\n    `dSpnBurstDrive`: Striatonigral dSPN inhibitory burst drive (scaled Nat, 0-100)\n    `snrTonicRate`: Baseline tonic GABAergic discharge rate of SNr projection neurons (Hz, scaled Nat)\n    `disinhibitionThreshold`: Maximum SNr rate considered an active disinhibitory pause (e.g. 15 Hz)\n    `reboundBurstMax`: Peak rebound burst frequency of thalamic relay neurons (e.g. 250 Hz)\n-/\nstructure NigrothalamicGateState where\n  dSpnBurstDrive : Nat\n  snrTonicRate : Nat\n  disinhibitionThreshold : Nat\n  reboundBurstMax : Nat\n  deriving Repr\n\n/-- Compute effective SNr firing rate under striatonigral inhibition:\n    snrTonicRate - (dSpnBurstDrive * snrTonicRate) / 100 (clamped at 0). -/\ndef computeSNrOutputRate (s : NigrothalamicGateState) : Nat :=\n  let inhibition := (s.dSpnBurstDrive * s.snrTonicRate) / 100\n  if s.snrTonicRate >= inhibition then\n    s.snrTonicRate - inhibition\n  else\n    0\n\n/-- Predicate for active thalamic disinhibition:\n    SNr output is suppressed below disinhibitionThreshold. -/\ndef isThalamusDisinhibited (s : NigrothalamicGateState) : Bool :=\n  computeSNrOutputRate s <= s.disinhibitionThreshold\n\n/-- Compute post-inhibitory rebound burst rate in motor thalamocortical relay cells (VM/VA).\n    When disinhibited: (reboundBurstMax * dSpnBurstDrive) / 100. -/\ndef computeThalamicReboundBurst (s : NigrothalamicGateState) : Nat :=\n  if isThalamusDisinhibited s then\n    (s.reboundBurstMax * s.dSpnBurstDrive) / 100\n  else\n    0\n\n/-- Theorem 1: SNr output firing rate decreases monotonically with striatonigral dSPN burst drive. -/\ntheorem snr_output_decreases_with_dspn (s : NigrothalamicGateState) (d1 d2 : Nat)\n    (h_le : d1 <= d2)\n    (h_bound : (d2 * s.snrTonicRate) / 100 <= s.snrTonicRate) :\n    let s1 : NigrothalamicGateState := { s with dSpnBurstDrive := d1 }\n    let s2 : NigrothalamicGateState := { s with dSpnBurstDrive := d2 }\n    computeSNrOutputRate s2 <= computeSNrOutputRate s1 := by", "figure_1_png": "docs/figures/figure_paper_191.png", "figure_1_svg": "docs/figures/figure_paper_191.svg", "figure_2_png": "docs/figures/figure_paper_191_validation.png", "figure_2_svg": "docs/figures/figure_paper_191_validation.svg"}, {"paper_number": 192, "target_number": 383, "title": "Globus Pallidus External Segment Subpopulation Dichotomy: Prototypic vs. Arkypallidal Neurons and Resonant Beta Oscillations in Parkinsonian States", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #383: GPeArkyPrototypicInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Historically regarded as a uniform relay station within the indirect pathway, the external segment of the globus pallidus (GPe) is now recognized as a master computational hub orchestrating basal ganglia dynamics. Recent single-cell transcriptomic and electrophysiological studies reveal two distinct functional subpopulations: parvalbumin-positive ($PV^+$) prototypic neurons and forkhead-box-P2-positive ($FoxP2^+$) arkypallidal neurons. Prototypic neurons project downstream to the subthalamic nucleus (STN), substantia nigra pars reticulata (SNr), and internal pallidum (GPi), engaging in reciprocal feedback with the STN to generate and synchronize physiological motor patterns and, under dopamine depletion, pathological beta oscillations (13\u201330 Hz). Conversely, arkypallidal neurons project exclusively upstream back to the striatum, providing widespread GABAergic collateral inhibition onto both direct and indirect spiny projection neurons and fast-spiking interneurons. Upon presentation of sudden behavioral Stop-Signals, arkypallidal neurons fire a rapid burst of action potentials that cancels developing striatal motor commands. Here, we formalize the GPe subpopulation dichotomy, arkypallidal stopping, and STN-GPe beta resonance invariants in Lean 4 (Target #383), implement an AVX2-accelerated network simulator delivering $>3.3\\times 10^9$ synaptic evaluations per second, provide a Triton 3.9 fused GPU kernel, and integrate an interactive real-time visual HUD into WEFT MSS Void.", "formal_proof": "namespace Weft.Formal\n\n/-- Subpopulation state of Globus Pallidus Externa:\n    `dopamineLevel`: Dopamine tone (scaled Nat, 0-100)\n    `isStopSignalTriggered`: Boolean indicating active cortical stop command\n    `prototypicRate`: PV+ GPe firing rate (Hz, scaled Nat)\n    `arkypallidalRate`: FoxP2+ GPe firing rate (Hz, scaled Nat)\n    `striatalDrive`: Ongoing corticostriatal motor activity (scaled Nat)\n-/\nstructure GPeNetworkState where\n  dopamineLevel : Nat\n  isStopSignalTriggered : Bool\n  prototypicRate : Nat\n  arkypallidalRate : Nat\n  striatalDrive : Nat\n  deriving Repr\n\n/-- Compute effective arkypallidal discharge rate:\n    When stop signal is triggered, arkypallidal cells burst at 55 Hz.\n    Otherwise baseline rate: 8 + (100 - min(100, dopamineLevel)) / 10. -/\ndef computeArkypallidalOutput (s : GPeNetworkState) : Nat :=\n  if s.isStopSignalTriggered then\n    55\n  else\n    let da_deficit := if s.dopamineLevel <= 100 then 100 - s.dopamineLevel else 0\n    8 + da_deficit / 10\n\n/-- Compute striatal motor program suppression under arkypallidal feedback:\n    striatalDrive - (striatalDrive * arkypallidalOutput) / 60. -/\ndef computeSuppressedStriatalDrive (s : GPeNetworkState) : Nat :=\n  let arky := computeArkypallidalOutput s\n  let inhib := (s.striatalDrive * arky) / 60\n  if s.striatalDrive >= inhib then\n    s.striatalDrive - inhib\n  else\n    0\n\n/-- Predicate for STN-GPe reciprocal resonance within pathological Parkinsonian beta band (13 to 30 Hz):\n    Resonant frequency f_res = 13 + (100 - min(100, dopamineLevel)) * 17 / 100. -/\ndef computeBetaResonantFrequency (s : GPeNetworkState) : Nat :=\n  let da_deficit := if s.dopamineLevel <= 100 then 100 - s.dopamineLevel else 0\n  13 + (da_deficit * 17) / 100\n\n/-- Theorem 1: Arkypallidal output rate is strictly maximized under active stop signal. -/\ntheorem arkypallidal_stop_burst_maximal (s : GPeNetworkState)\n    (h_stop : s.isStopSignalTriggered = true)\n    (h_da_bound : s.dopamineLevel <= 100) :\n    let s_unstopped : GPeNetworkState := { s with isStopSignalTriggered := false }\n    computeArkypallidalOutput s_unstopped <= computeArkypallidalOutput s := by", "figure_1_png": "docs/figures/figure_paper_192.png", "figure_1_svg": "docs/figures/figure_paper_192.svg", "figure_2_png": "docs/figures/figure_paper_192_validation.png", "figure_2_svg": "docs/figures/figure_paper_192_validation.svg"}, {"paper_number": 193, "target_number": 384, "title": "Pedunculopontine Nucleus Subpopulations, Mesencephalic Locomotor Region Gating, and Spinal Central Pattern Generator Rhythms", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #384: PPNSubpopulationLocomotorInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Locomotion requires the coordinated, rhythmic alternation of flexor and extensor motor pools across limb pairs, generated autonomously by intrinsic spinal networks known as central pattern generators (CPGs). The initiation, cadence, and termination of CPG activity are governed supraspinally by the mesencephalic locomotor region (MLR), whose principal anatomical node is the pedunculopontine nucleus (PPN). Comprising two neurochemically divergent subpopulations\u2014cholinergic neurons within the pars compacta ($ChAT^+$) and glutamatergic neurons within the pars dissipata ($vGluT2^+$)\u2014the PPN integrates basal ganglia inhibitory control with descending reticulospinal drive. Selective activation of glutamatergic PPN neurons recruits reticulospinal projection neurons in the ventromedial medulla, triggering spinal CPG rhythmogenesis and driving speed-dependent gait frequency transitions (from slow walking to running). Conversely, pathological hyper-inhibition of the PPN by GABAergic inputs from the substantia nigra pars reticulata (SNr) and internal pallidum (GPi) in Parkinsonian states causes abrupt locomotor arrest, clinically manifesting as Freezing of Gait (FoG). Here, we formalize PPN locomotor CPG gating and speed scaling in Lean 4 (Target #384), implement an AVX2-accelerated CPG cadence engine yielding $>2.3\\times 10^5\\text{ Melem/s}$, provide a Triton 3.9 fused GPU kernel, and deploy an interactive real-time visual HUD into WEFT MSS Void.", "formal_proof": "namespace Weft.Formal\n\n/-- State of the mesencephalic locomotor region and spinal CPG:\n    `pprnGlutDrive`: PPN glutamatergic descending drive (scaled Nat, 0-100)\n    `bgGabaClamp`: Basal ganglia inhibitory output (SNr/GPi) onto PPN (scaled Nat, 0-100)\n    `initiationThreshold`: Minimum net drive required to break stance (scaled Nat, e.g. 15)\n    `maxCadenceDeciHz`: Upper biophysical limit on stepping cadence in tenths of Hz (e.g. 28 for 2.8 Hz)\n-/\nstructure LocomotorCPGState where\n  pprnGlutDrive : Nat\n  bgGabaClamp : Nat\n  initiationThreshold : Nat\n  maxCadenceDeciHz : Nat\n  h_thresh_pos : initiationThreshold > 0\n  deriving Repr\n\n/-- Compute net descending locomotor drive:\n    pprnGlutDrive - bgGabaClamp (when pprnGlutDrive >= bgGabaClamp). -/\ndef computeNetLocomotorDrive (s : LocomotorCPGState) : Nat :=\n  if s.pprnGlutDrive >= s.bgGabaClamp then\n    s.pprnGlutDrive - s.bgGabaClamp\n  else\n    0\n\n/-- Predicate for active locomotion:\n    Net drive strictly exceeds initiationThreshold. -/\ndef isLocomotionInitiated (s : LocomotorCPGState) : Bool :=\n  computeNetLocomotorDrive s >= s.initiationThreshold\n\n/-- Compute stepping cadence in tenths of Hz (deci-Hz):\n    When stationary: 0.\n    When active: 8 (0.8 Hz) + (netDrive - initiationThreshold) * 20 / 85 (capped at maxCadenceDeciHz). -/\ndef computeSteppingCadence (s : LocomotorCPGState) : Nat :=\n  if isLocomotionInitiated s then\n    let net := computeNetLocomotorDrive s\n    let raw := 8 + ((net - s.initiationThreshold) * 20) / 85\n    if raw <= s.maxCadenceDeciHz then raw else s.maxCadenceDeciHz\n  else\n    0\n\n/-- Theorem 1: Net locomotor drive increases monotonically with PPN glutamatergic drive. -/\ntheorem net_drive_monotonic_with_ppn (s : LocomotorCPGState) (g1 g2 : Nat)\n    (h_le : g1 <= g2)\n    (h_clamp : s.bgGabaClamp <= g1) :\n    let s1 : LocomotorCPGState := { s with pprnGlutDrive := g1 }\n    let s2 : LocomotorCPGState := { s with pprnGlutDrive := g2 }\n    computeNetLocomotorDrive s1 <= computeNetLocomotorDrive s2 := by", "figure_1_png": "docs/figures/figure_paper_193.png", "figure_1_svg": "docs/figures/figure_paper_193.svg", "figure_2_png": "docs/figures/figure_paper_193_validation.png", "figure_2_svg": "docs/figures/figure_paper_193_validation.svg"}, {"paper_number": 194, "target_number": 385, "title": "Cuneiform Nucleus High-Speed Locomotor Escape: Mesencephalic Subpopulation Specialization and Asymmetric Gait Bifurcations", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #385: CuneiformEscapeLocomotionInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Locomotor control in vertebrates is not mediated by a monolithic command center, but by distinct functional modules segregated across the mesencephalic locomotor region (MLR). Whereas the pedunculopontine nucleus (PPN) modulates low-velocity exploratory walking, postural muscle tone, and gait initiation, the adjacent cuneiform nucleus (CnF) is uniquely specialized for emergency escape behaviors, fast running, and asymmetric gait transitions (trot-to-gallop/bound). Glutamatergic neurons within the CnF receive prominent monosynaptic inputs from the superior colliculus deep layers and the central amygdala, discharging vigorously upon perception of sudden environmental threats (e.g., visual looming stimuli). High-frequency CnF outflow to the ventrolateral medulla and spinal central pattern generators (CPGs) drives instantaneous transitions in stepping kinematics: cadence accelerates beyond 3.5\u20135.0 Hz, stride length expands, and interlimb coordination undergoes a discontinuous topological bifurcation wherein the left-right phase lag collapses from alternating anti-phase ($180^\\circ$) to synchronous in-phase bounding ($< 45^\\circ$). In this work, we formalize the CnF escape drive, phase lag collapse, and gallop transition invariants in Lean 4 (Target #385), implement an AVX2-accelerated escape simulation engine yielding $>3.1\\times 10^9$ kinematic updates per second, provide a Triton 3.9 fused GPU kernel, and deploy an interactive real-time visual HUD into WEFT MSS Void.", "formal_proof": "namespace Weft.Formal\n\n/-- State of the mesencephalic cuneiform locomotor escape circuit:\n    `cnfDrive`: Cuneiform glutamatergic drive (scaled Nat, 0-100)\n    `threatLevel`: Afferent collicular/amygdaloid threat input (scaled Nat, 0-100)\n    `gallopThreshold`: Effective drive threshold for asymmetric sprint gallop (scaled Nat, e.g. 45)\n    `maxCadenceDeciHz`: Maximum escape cadence limit in tenths of Hz (e.g. 50 for 5.0 Hz)\n-/\nstructure CnFEscapeState where\n  cnfDrive : Nat\n  threatLevel : Nat\n  gallopThreshold : Nat\n  maxCadenceDeciHz : Nat\n  h_gallop_pos : gallopThreshold > 0\n  deriving Repr\n\n/-- Compute effective escape drive:\n    (cnfDrive * (30 + (threatLevel * 70) / 100)) / 100. -/\ndef computeEffectiveDrive (s : CnFEscapeState) : Nat :=\n  let threatMod := 30 + (s.threatLevel * 70) / 100\n  (s.cnfDrive * threatMod) / 100\n\n/-- Predicate for high-speed gallop/bound regime:\n    Effective escape drive strictly exceeds gallopThreshold. -/\ndef isGallopTransitionActive (s : CnFEscapeState) : Bool :=\n  computeEffectiveDrive s >= s.gallopThreshold\n\n/-- Compute interlimb left-right phase lag in degrees:\n    Symmetric walk/trot (when effective drive < gallopThreshold): 180 degrees (alternating).\n    Asymmetric sprint gallop (when effective drive >= gallopThreshold):\n    Phase collapses from 180 toward in-phase synchrony (bounded below by 25 deg). -/\ndef computeInterlimbPhaseLag (s : CnFEscapeState) : Nat :=\n  if isGallopTransitionActive s then\n    let excess := computeEffectiveDrive s - s.gallopThreshold\n    let collapse := (excess * 155) / 55\n    if 180 >= collapse + 25 then\n      180 - collapse\n    else\n      25\n  else\n    180\n\n/-- Compute sprint escape cadence in tenths of Hz (deci-Hz):\n    When stationary (effective drive < 15): 0.\n    When trotting (15 <= drive < gallopThreshold): 10 + ((drive - 15) * 15) / 30 (bounded by maxCadenceDeciHz).", "figure_1_png": "docs/figures/figure_paper_194.png", "figure_1_svg": "docs/figures/figure_paper_194.svg", "figure_2_png": "docs/figures/figure_paper_194_validation.png", "figure_2_svg": "docs/figures/figure_paper_194_validation.svg"}, {"paper_number": 195, "target_number": 386, "title": "Locus Coeruleus Norepinephrine (LC-NE) Gain Modulation, Cortical Signal-to-Noise Ratio, and Yerkes-Dodson Arousal Invariants", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #386: LocusCoeruleusGainInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "The locus coeruleus (LC) noradrenergic system exerts pervasive modulatory control over mammalian thalamocortical networks, shaping sensory perception, behavioral flexibility, and motor execution. Historically conceptualized as a global, non-specific arousal switch, contemporary neurophysiological evidence demonstrates that the LC operates in two distinct functional modes: a phasic burst mode coupled to decision salience and an elevated tonic mode associated with behavioral exploration, distractibility, and hyperarousal. In this paper, we formalize the Aston-Jones and Cohen (2005) Adaptive Gain Theory within the WEFT formal verification suite. We establish that noradrenergic input monotonically scales the slope of cortical input-output transfer functions (cortical gain, $G$). Crucially, while noradrenaline amplifies target-evoked postsynaptic potentials, elevated baseline noradrenaline simultaneously increases spontaneous cortical synaptic noise. Consequently, the effective signal-to-noise ratio ($\\mathrm{SNR}$) follows a non-linear, inverted-U relationship with respect to baseline tonic LC activity\u2014a biophysical realization of the classic Yerkes-Dodson law. We formalize these gain-scaling and noise-invariance theorems in Lean 4 without empirical axioms, benchmark the vectorized microkinematics using AVX2 SIMD instructions yielding throughput exceeding 50,000 Melem/s, validate a high-performance Triton 3.9 GPU kernel, and demonstrate how pharmacological or pathological alterations of LC tone dictate transitions between sedated hypoarousal, focused task exploitation, and labile hyperarousal.", "formal_proof": "namespace Weft.Formal\n\n/-- State parameters representing Locus Coeruleus activity and cortical target circuits.\n    All rates and gains are represented in scaled natural units (tenths of Hz or integer multipliers). -/\nstructure LCState where\n  /-- Tonic baseline firing rate of LC neurons (scaled Nat, 0 - 150 representing 0.0 - 15.0 Hz) -/\n  tonicRate : Nat\n  /-- Phasic burst activity elicited by salient task events (scaled Nat, 0 - 100 representing 0.0 - 10.0 Hz) -/\n  phasicBurst : Nat\n  /-- Background non-noradrenergic spontaneous noise level in cortex -/\n  baselineNoise : Nat\n  /-- Target stimulus input amplitude (salience) -/\n  stimulusInput : Nat\n  h_baseline_pos : baselineNoise > 0\n  deriving Repr\n\n/-- Monotonic cortical gain amplification factor:\n    G = 10 + (3 * tonicRate) / 10 + (5 * phasicBurst) / 10 (scaled integer factor) -/\ndef corticalGain (s : LCState) : Nat :=\n  10 + (3 * s.tonicRate) / 10 + (5 * s.phasicBurst) / 10\n\n/-- Effective amplified signal response: S = corticalGain * stimulusInput -/\ndef effectiveSignal (s : LCState) : Nat :=\n  corticalGain s * s.stimulusInput\n\n/-- Cortical spontaneous noise level, scaling with baseline noise and tonic noradrenergic drive:\n    N = baselineNoise + (2 * tonicRate) / 10 -/\ndef effectiveNoise (s : LCState) : Nat :=\n  s.baselineNoise + (2 * s.tonicRate) / 10\n\n/-- Theorem 1: Cortical gain is strictly positive and bounded from below by baseline gain 10. -/\ntheorem cortical_gain_strictly_positive (s : LCState) :\n    corticalGain s >= 10 := by\n  dsimp [corticalGain]\n  omega\n\n/-- Theorem 2: Effective noise is strictly positive provided baseline noise > 0. -/\ntheorem effective_noise_positive (s : LCState) :\n    effectiveNoise s > 0 := by", "figure_1_png": "docs/figures/figure_paper_195.png", "figure_1_svg": "docs/figures/figure_paper_195.svg", "figure_2_png": "docs/figures/figure_paper_195_validation.png", "figure_2_svg": "docs/figures/figure_paper_195_validation.svg"}, {"paper_number": 196, "target_number": 387, "title": "Dorsal Raphe Nucleus Serotonin (5-HT) Firing Tone, Hyperbolic Temporal Discounting, and Impulsive Waiting Abort Invariants", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #387: DorsalRaphePatienceInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Impulsive decision-making\u2014manifesting as the inability to suppress immediate action in exchange for delayed, superior reward\u2014is a hallmark feature of neurodevelopmental and psychiatric disorders, including ADHD, substance dependence, and borderline personality pathology. Convergent electrophysiological, optogenetic, and pharmacological investigations implicate the dorsal raphe nucleus (DRN) serotonergic projection system as a critical neuromodulatory regulator of waiting patience. In this paper, we formalize the neuromodulatory interaction between tonic 5-HT signaling and subjective temporal discounting within the WEFT formal verification suite. Integrating the empirical paradigms of Miyazaki et al. (2014, 2018) and Doya (2002), we model subjective reward valuation as a hyperbolic discount function whose decay parameter, $k$, is strictly attenuated by ascending serotonergic tone. Under acute tryptophan depletion or DRN inhibition, $k$ accelerates, causing the net subjective value of anticipated rewards to collapse rapidly below the behavioral quitting threshold, precipitating premature action initiation (impulsivity). Conversely, selective optogenetic stimulation of DRN serotonergic neurons decelerates discounting, preserving subjective value across prolonged delays and sustaining behavioral perseverance. We formalize these waiting-preservation and monotonicity theorems in Lean 4 without empirical axioms, benchmark the vectorized microkinematics using AVX2 SIMD instructions yielding throughput exceeding 68,000 Melem/s, validate a high-performance Triton 3.9 GPU kernel, and evaluate phase transitions across acute depletion, physiological basal tone, and optogenetically reinforced perseverance.", "formal_proof": "namespace Weft.Formal\n\n/-- State parameters representing serotonergic tone, delay duration, and reward value.\n    All rates, values, and delays are represented in scaled natural units. -/\nstructure SerotoninState where\n  /-- Dorsal raphe 5-HT firing tone (scaled Nat, 0 - 100 representing 0.0 - 10.0 Hz) -/\n  serotoninTone : Nat\n  /-- Nominal delayed reward magnitude (scaled Nat, e.g. 100) -/\n  nominalReward : Nat\n  /-- Delay time until reward delivery (scaled Nat, tenths of seconds) -/\n  delayTime : Nat\n  /-- Baseline temporal discounting coefficient (scaled Nat, e.g. 50) -/\n  kBaseline : Nat\n  /-- Action abortion / impatience threshold (scaled Nat, e.g. 20) -/\n  abortThreshold : Nat\n  h_kbase_pos : kBaseline > 0\n  deriving Repr\n\n/-- Effective discount parameter k(5HT):\n    k_eff = (kBaseline * 100) / (100 + serotoninTone * 5)\n    As 5-HT tone escalates, the discount rate k_eff strictly decreases (slower decay). -/\ndef effectiveDiscountRate (s : SerotoninState) : Nat :=\n  (s.kBaseline * 100) / (100 + s.serotoninTone * 5)\n\n/-- Subjective discounted value V(t):\n    V = (nominalReward * 1000) / (1000 + effectiveDiscountRate * delayTime) -/\ndef subjectiveRewardValue (s : SerotoninState) : Nat :=\n  (s.nominalReward * 1000) / (1000 + effectiveDiscountRate s * s.delayTime)\n\n/-- Theorem 1: Effective discount rate is non-negative and bounded above by kBaseline. -/\ntheorem discount_rate_bounded_by_baseline (s : SerotoninState) :\n    effectiveDiscountRate s <= s.kBaseline := by\n  dsimp [effectiveDiscountRate]\n  have h_denom : 100 + s.serotoninTone * 5 >= 100 := by omega\n  refine Nat.div_le_of_le_mul ?_\n  have h_mul : s.kBaseline * 100 <= s.kBaseline * (100 + s.serotoninTone * 5) := by\n    apply Nat.mul_le_mul_left\n    omega\n  rw [Nat.mul_comm (100 + s.serotoninTone * 5) s.kBaseline]\n  exact h_mul", "figure_1_png": "docs/figures/figure_paper_196.png", "figure_1_svg": "docs/figures/figure_paper_196.svg", "figure_2_png": "docs/figures/figure_paper_196_validation.png", "figure_2_svg": "docs/figures/figure_paper_196_validation.svg"}, {"paper_number": 197, "target_number": 388, "title": "Basal Forebrain Acetylcholine (BF-ACh) Attention Cue Detection, Thalamocortical Gain Amplification, and Expected Uncertainty Invariants", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #388: BasalForebrainAcetylcholineInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Selective sensory attention requires neocortical networks to dynamically arbitrate between ascending bottom-up sensory evidence and top-down prior expectations. The basal forebrain (BF) cholinergic projection system serves as the primary neuromodulatory arbiter of this computational trade-off. In this paper, we formalize the Hasselmo (1995, 2006) and Yu & Dayan (2005) cholinergic attentional gating hypothesis within the WEFT formal verification suite. We establish that acetylcholine (ACh) release exerts differential, locus-specific synaptic control in primary sensory and association cortices: it enhances nicotinic and muscarinic $M_1$-mediated thalamocortical feedforward excitatory postsynaptic currents while simultaneously suppressing presynaptic $M_2/M_4$ muscarinic transmission at recurrent intracortical horizontal synapses. When environmental cues signal expected uncertainty, phasic cholinergic bursts amplify sensory signal transmission by over 3-fold while attenuating runaway recurrent reverberation by up to 75%. In the absence of cholinergic drive (as observed following 192 IgG-saporin BF lesions or in Alzheimer's disease), intracortical feedback loops dominate sensory processing, generating hallucinations, sensory cue omission, and profound attentional neglect. We prove the underlying monotonicity, gain lower-bound, and recurrent suppression invariants in Lean 4 with 0 axioms, benchmark the vectorized AVX2 SIMD microkinematics yielding throughput exceeding 58,000 Melem/s, validate a high-performance Triton 3.9 GPU kernel, and evaluate cue detection dynamics across cholinergic depletion, tonic arousal, and cue-locked phasic bursts.", "formal_proof": "namespace Weft.Formal\n\n/-- State parameters representing basal forebrain cholinergic release and cortical circuits.\n    All rates, gains, and drive inputs are scaled natural units. -/\nstructure AChState where\n  /-- Basal forebrain cholinergic tone (scaled Nat, 0 - 100 representing 0.0 - 10.0 uM) -/\n  achTone : Nat\n  /-- Phasic cue-elicited ACh surge (scaled Nat, 0 - 50 representing 0.0 - 5.0 uM) -/\n  phasicSurge : Nat\n  /-- Thalamocortical sensory feedforward input amplitude -/\n  feedforwardInput : Nat\n  /-- Intracortical recurrent feedback input amplitude -/\n  recurrentDrive : Nat\n  deriving Repr\n\n/-- Total effective cholinergic concentration:\n    [ACh] = achTone + phasicSurge -/\ndef effectiveACh (s : AChState) : Nat :=\n  s.achTone + s.phasicSurge\n\n/-- Feedforward thalamocortical synaptic gain:\n    G_ff = 10 + (35 * effectiveACh) / 100 (scaled integer multiplier, base 10 = 1.0x) -/\ndef feedforwardGain (s : AChState) : Nat :=\n  10 + (35 * effectiveACh s) / 100\n\n/-- Recurrent intracortical synaptic transmission weight:\n    W_rec = 1000 / (100 + (effectiveACh s * 5))\n    As ACh increases, presynaptic muscarinic inhibition drives W_rec strictly down. -/\ndef recurrentWeight (s : AChState) : Nat :=\n  1000 / (100 + effectiveACh s * 5)\n\n/-- Amplified sensory feedforward response in cortex:\n    S_ff = feedforwardGain * feedforwardInput -/\ndef feedforwardSignal (s : AChState) : Nat :=\n  feedforwardGain s * s.feedforwardInput\n\n/-- Theorem 1: Thalamocortical feedforward gain is strictly positive and bounded below by baseline 10. -/\ntheorem feedforward_gain_strictly_positive (s : AChState) :\n    feedforwardGain s >= 10 := by", "figure_1_png": "docs/figures/figure_paper_197.png", "figure_1_svg": "docs/figures/figure_paper_197.svg", "figure_2_png": "docs/figures/figure_paper_197_validation.png", "figure_2_svg": "docs/figures/figure_paper_197_validation.svg"}, {"paper_number": 198, "target_number": 389, "title": "Lateral Habenula (LHb) Anti-Reward Circuitry, Rostromedial Tegmental Nucleus (RMTg) GABA Relay, and Midbrain Dopaminergic Pause Invariants", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #389: LHbAntiRewardAversionInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "While midbrain dopaminergic neurons in the substantia nigra pars compacta (SNc) and ventral tegmental area (VTA) fire phasic bursts to positive reward prediction errors, the neural substrate encoding disappointment, reward omission, and aversive outcomes has long eluded comprehensive formalization. Seminal electrophysiological investigations by Matsumoto and Hikosaka (2007, 2009) established that the lateral habenula (LHb) functions as the primary \"anti-reward\" center of the epithalamus. LHb glutamatergic projection neurons fire phasically when an expected reward is omitted or when conditioned stimuli predict noxious events. Rather than innervating dopamine neurons directly, LHb axons synapse heavily onto the rostromedial tegmental nucleus (RMTg / \"tail of the VTA\"), which delivers powerful feedforward GABAergic inhibition to dopaminergic perikarya, generating characteristic post-inhibitory pauses in dopamine release. In this paper, we formalize the LHb-RMTg-VTA anti-reward axis within the WEFT formal verification suite. We prove that negative reward prediction errors ($\\mathrm{nRPE} = \\max(0, R_{\\mathrm{exp}} - R_{\\mathrm{act}})$) and aversive stress inputs monotonically escalate LHb burst frequency, driving RMTg GABAergic transmission to force complete dopaminergic silencing ($\\mathrm{DA} = 0$). We prove these non-linear gating and pause invariants in Lean 4 without empirical axioms, benchmark the vectorized AVX2 SIMD microkinematics yielding throughput exceeding 65,000 Melem/s, validate a high-performance Triton 3.9 GPU kernel, and demonstrate how chronic habenular hyperactivity instigates the behavioral phenocopy of major depressive learned helplessness and anhedonia.", "formal_proof": "namespace Weft.Formal\n\n/-- State parameters representing the Lateral Habenula, RMTg, and VTA dopamine circuit.\n    All firing rates, prediction errors, and stress levels are scaled natural units. -/\nstructure HabenulaState where\n  /-- Expected reward value (scaled Nat, 0 - 100) -/\n  expectedReward : Nat\n  /-- Actual obtained reward outcome (scaled Nat, 0 - 100) -/\n  actualOutcome : Nat\n  /-- Afferent aversive stress / nociceptive input (scaled Nat, 0 - 100) -/\n  aversiveStress : Nat\n  /-- Baseline tonic LHb firing rate (scaled Nat, e.g. 8 representing 8 Hz) -/\n  tonicBaseline : Nat\n  /-- Maximum baseline dopamine firing rate in VTA (scaled Nat, e.g. 50 representing 5.0 Hz) -/\n  daBaseline : Nat\n  deriving Repr\n\n/-- Negative Reward Prediction Error (nRPE):\n    nRPE = if expectedReward > actualOutcome then expectedReward - actualOutcome else 0 -/\ndef negativeRPE (s : HabenulaState) : Nat :=\n  if s.expectedReward > s.actualOutcome then s.expectedReward - s.actualOutcome else 0\n\n/-- Lateral Habenula firing rate:\n    Rate_LHb = tonicBaseline + (45 * negativeRPE) / 100 + (35 * aversiveStress) / 100 -/\ndef lhbFiringRate (s : HabenulaState) : Nat :=\n  s.tonicBaseline + (45 * negativeRPE s) / 100 + (35 * s.aversiveStress) / 100\n\n/-- RMTg GABAergic inhibitory output rate driving VTA dopamine neurons:\n    Rate_RMTg = 5 + (85 * lhbFiringRate) / 100 -/\ndef rmtgGABAOutput (s : HabenulaState) : Nat :=\n  5 + (85 * lhbFiringRate s) / 100\n\n/-- VTA Dopamine firing rate suppressed by RMTg GABAergic transmission:\n    DA_rate = if daBaseline >= rmtgGABAOutput then daBaseline - rmtgGABAOutput else 0 -/\ndef vtaDAFiringRate (s : HabenulaState) : Nat :=\n  if s.daBaseline >= rmtgGABAOutput s then s.daBaseline - rmtgGABAOutput s else 0\n\n/-- Theorem 1: LHb firing rate is strictly bounded below by tonic baseline. -/", "figure_1_png": "docs/figures/figure_paper_198.png", "figure_1_svg": "docs/figures/figure_paper_198.svg", "figure_2_png": "docs/figures/figure_paper_198_validation.png", "figure_2_svg": "docs/figures/figure_paper_198_validation.svg"}, {"paper_number": 199, "target_number": 390, "title": "Ventral Tegmental Area (VTA) Dopaminergic Plasticity, Three-Factor Learning Rules, and Synaptic Consolidation Invariants", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #390: VTADopamineThreeFactorInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Standard two-factor Hebbian learning models\u2014where synaptic modifications depend solely on correlated pre- and postsynaptic firing\u2014suffer from catastrophic temporal credit assignment failures and unbounded runaway potentiation. To bridge the gap between behavioral reinforcement learning (which operates across behavioral delays of hundreds of milliseconds to seconds) and millisecond-timescale spike-timing-dependent plasticity (STDP), biological neural systems deploy neuromodulated *three-factor learning rules*. In this paper, we formalize the Reynolds and Wickens (2002) and Gerstner et al. (2018) three-factor plasticity framework within the WEFT formal verification suite. Pre- and postsynaptic spike coincidence generates an intracellular biochemical \"eligibility trace\" ($e$), mediated by calcium influx and calmodulin activation, which decays exponentially unless consolidated. Phasic dopamine bursts or pauses emitted by ventral tegmental area (VTA) projection neurons serve as the broadcast third factor ($RPE$): extracellular dopamine binding to $D_1/D_5$ receptors initiates a PKA phosphorylation cascade converting the trace into permanent AMPA receptor insertion (long-term potentiation, LTP), whereas dopamine pauses allow protein phosphatase 1 (PP1) and calcineurin to mediate clathrin-dependent AMPA receptor endocytosis (long-term depression, LTD). We formalize the three-factor learning invariants and conductance bounds in Lean 4 with 0 axioms, benchmark the vectorized AVX2 SIMD microkinematics yielding throughput exceeding 51,000 Melem/s, validate a high-performance Triton 3.9 GPU kernel, and demonstrate how dopamine bursts and pauses dictate associative credit assignment in striatal and prefrontal circuits.", "formal_proof": "namespace Weft.Formal\n\n/-- State parameters representing pre/post synaptic firing, eligibility trace, and dopamine signal.\n    All rates, weights, and concentrations are scaled natural units. -/\nstructure PlasticityState where\n  /-- Presynaptic spike rate (scaled Nat, 0 - 100) -/\n  preRate : Nat\n  /-- Postsynaptic spike rate / dendritic depolarization (scaled Nat, 0 - 100) -/\n  postRate : Nat\n  /-- Ambient dopamine concentration (scaled Nat, 0 - 100, where baseline = 50) -/\n  dopamineLevel : Nat\n  /-- Current synaptic weight (scaled Nat, e.g. 100 representing 1.0) -/\n  currentWeight : Nat\n  /-- Minimum allowable weight (scaled Nat, e.g. 10) -/\n  minWeight : Nat\n  /-- Maximum allowable weight (scaled Nat, e.g. 350) -/\n  maxWeight : Nat\n  h_bounds : minWeight <= maxWeight\n  deriving Repr\n\n/-- Baseline ambient dopamine level separating positive from negative RPE -/\ndef daBaseline : Nat := 50\n\n/-- Factor 1 x Factor 2: Pre-post Hebbian coincidence eligibility trace:\n    e = (preRate * postRate) / 100 -/\ndef eligibilityTrace (s : PlasticityState) : Nat :=\n  (s.preRate * s.postRate) / 100\n\n/-- Positive Reward Prediction Error magnitude:\n    RPE+ = if dopamineLevel > daBaseline then dopamineLevel - daBaseline else 0 -/\ndef positiveRPE (s : PlasticityState) : Nat :=\n  if s.dopamineLevel > daBaseline then s.dopamineLevel - daBaseline else 0\n\n/-- Negative Reward Prediction Error magnitude:\n    RPE- = if dopamineLevel < daBaseline then daBaseline - s.dopamineLevel else 0 -/\ndef negativeRPE (s : PlasticityState) : Nat :=\n  if s.dopamineLevel < daBaseline then daBaseline - s.dopamineLevel else 0\n\n/-- Raw potentiation increment (LTP delta):\n    dW+ = (eligibilityTrace * positiveRPE) / 100 -/\ndef ltpIncrement (s : PlasticityState) : Nat :=\n  (eligibilityTrace s * positiveRPE s) / 100\n\n/-- Raw depression decrement (LTD delta):\n    dW- = (eligibilityTrace * negativeRPE) / 100 -/\ndef ltdDecrement (s : PlasticityState) : Nat :=\n  (eligibilityTrace s * negativeRPE s) / 100\n\n/-- Net intermediate decayed weight:\n    decayed = if W + dW+ >= dW- then W + dW+ - dW- else 0 -/\ndef intermediateWeight (s : PlasticityState) : Nat :=\n  let raw := s.currentWeight + ltpIncrement s\n  if raw >= ltdDecrement s then raw - ltdDecrement s else 0\n\n/-- Updated synaptic weight applying bounded three-factor learning:\n    Clamp intermediate weight to [minWeight, maxWeight] -/\ndef updatedWeight (s : PlasticityState) : Nat :=\n  let decayed := intermediateWeight s\n  if decayed <= s.minWeight then s.minWeight\n  else if decayed >= s.maxWeight then s.maxWeight\n  else decayed\n\n/-- Theorem 1: Eligibility trace is monotonic with presynaptic activity. -/\ntheorem eligibility_monotone_pre (s : PlasticityState) (pre1 pre2 : Nat) (h_pre : pre1 <= pre2) :\n    eligibilityTrace { s with preRate := pre1 } <=\n    eligibilityTrace { s with preRate := pre2 } := by", "figure_1_png": "docs/figures/figure_paper_199.png", "figure_1_svg": "docs/figures/figure_paper_199.svg", "figure_2_png": "docs/figures/figure_paper_199_validation.png", "figure_2_svg": "docs/figures/figure_paper_199_validation.svg"}, {"paper_number": 200, "target_number": 391, "title": "Central Neuromodulatory Convergence, Multi-Transmitter Dynamics, and Motor Action Arbitration Invariants", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #391: MultineuromodulatorArbitrationInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Mammalian motor action selection, behavioral perseverance, and reinforcement learning are not governed by isolated neurotransmitter circuits. Rather, adaptive survival in dynamic environments emerges from the concurrent, real-time convergence of five primary ascending neuromodulatory projection systems: acetylcholine (ACh) from the basal forebrain, norepinephrine (NE) from the locus coeruleus, serotonin (5-HT) from the dorsal raphe nucleus, dopamine (DA) from the ventral tegmental area and substantia nigra pars compacta, and epithalamic anti-reward signaling from the lateral habenula (LHb) via the rostromedial tegmental nucleus (RMTg). In this 200th milestone paper of the neurobiology series, we present a unified theoretical and formal framework reconciling these systems into a coherent, non-saturating control architecture. We prove that: (1) Basal forebrain cholinergic tone gates sensory cue detection against expected environmental uncertainty; (2) Locus coeruleus noradrenaline scales cortical transfer gain along an inverted-U Yerkes-Dodson arousal function; (3) Dorsal raphe serotonin attenuates hyperbolic temporal discounting, preserving motor suppression across delayed waiting intervals; (4) VTA dopamine delivers the third factor consolidating calcium-calmodulin eligibility traces into enduring long-term potentiation (LTP); and (5) Lateral habenula burst discharges recruit RMTg GABAergic transmission to deliver a dominant aversive veto ($\\mathrm{DA}_{\\mathrm{net}} = 0$), preventing catastrophic action execution under learned helplessness or punishment. We formalize this grand multi-transmitter synthesis in Lean 4 without empirical axioms, benchmark vectorized AVX2 SIMD microkinematics yielding throughput exceeding 1,500 Melem/s (7.8 billion transmitter operations/second), validate an end-to-end fused Triton 3.9 GPU kernel, and demonstrate the seamless coordination of all five axes across cue ingestion, optimal vigilance, delayed patience, reward consolidation, and aversive termination.", "formal_proof": "namespace Weft.Formal\n\n/-- State parameters representing the 5 convergent ascending neuromodulatory systems.\n    All concentrations, firing rates, and weights are scaled natural units. -/\nstructure MultiTransmitterState where\n  /-- Basal forebrain acetylcholine tone (scaled Nat, 0 - 100) -/\n  achTone : Nat\n  /-- Locus coeruleus norepinephrine firing rate (scaled Nat, 0 - 100) -/\n  neRate : Nat\n  /-- Dorsal raphe serotonin tone (scaled Nat, 0 - 100) -/\n  serotoninTone : Nat\n  /-- VTA dopamine positive prediction error (scaled Nat, 0 - 100) -/\n  dopamineRPE : Nat\n  /-- Lateral habenula aversive stress drive (scaled Nat, 0 - 100) -/\n  habenulaStress : Nat\n  /-- Baseline maximum allowable cortical gain ceiling (scaled Nat, e.g. 500) -/\n  gainCeiling : Nat\n  h_ceiling_pos : gainCeiling >= 100\n  deriving Repr\n\n/-- Effective Cortical Attentional Gain:\n    Amplified by ACh feedforward boost and NE arousal gain, capped by physiological ceiling:\n    G_eff = min(gainCeiling, 10 + (35 * achTone) / 100 + (35 * neRate) / 100) -/\ndef effectiveCorticalGain (s : MultiTransmitterState) : Nat :=\n  let raw := 10 + (35 * s.achTone) / 100 + (35 * s.neRate) / 100\n  if raw <= s.gainCeiling then raw else s.gainCeiling\n\n/-- Net Consolidated Dopaminergic Signal after Habenular GABAergic Veto:\n    DA_net = if dopamineRPE > habenulaStress then dopamineRPE - habenulaStress else 0 -/\ndef netConsolidatedDopamine (s : MultiTransmitterState) : Nat :=\n  if s.dopamineRPE > s.habenulaStress then s.dopamineRPE - s.habenulaStress else 0\n\n/-- Waiting Patience Multiplier from Serotonergic Tone:\n    P = 100 + 45 * serotoninTone -/\ndef waitingCapacity (s : MultiTransmitterState) : Nat :=\n  100 + 45 * s.serotoninTone\n\n/-- Consolidated Motor Readiness Score:\n    Readiness is enhanced by net DA and cortical gain, but suppressed by excessive waiting patience:", "figure_1_png": "docs/figures/figure_paper_200.png", "figure_1_svg": "docs/figures/figure_paper_200.svg", "figure_2_png": "docs/figures/figure_paper_200_validation.png", "figure_2_svg": "docs/figures/figure_paper_200_validation.svg"}, {"paper_number": 201, "target_number": 392, "title": "Thalamic Reticular Nucleus (TRN) Sensory Attentional Filtering, Cross-Modal Lateral Inhibition, and T-Type Burst-Tonic Invariants", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #392: TRNAttentionalGatingInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Before ascending sensory signals reach the primary neocortex for conscious perception, they must traverse the dorsal thalamus, an obligatory relay enveloped by a thin shell of GABAergic neurons known as the thalamic reticular nucleus (TRN). Originally hypothesized by Francis Crick (1984) as the physical substrate of the attentional \"searchlight,\" contemporary electrophysiological and optogenetic investigations (Halassa et al., 2014; Wimmer et al., 2015) demonstrate that the TRN functions as an active, top-down-steered filter. Pyramidal projections from prefrontal cortex (PFC) bias TRN activity in a sector-specific manner, selectively suppressing unattended thalamocortical channels (e.g., visual lateral geniculate nucleus [LGN] vs auditory medial geniculate nucleus [MGN]) via feedforward and lateral GABAergic inhibition. Furthermore, TRN and relay neurons express high densities of low-threshold, T-type calcium channels ($\\mathrm{Ca}_v3.1, \\mathrm{Ca}_v3.2$). Hyperpolarization below $-65\\,\\mathrm{mV}$ (induced by cholinergic/noradrenergic withdrawal or synchronized TRN bursts) deinactivates T-type channels, triggering rhythmic low-threshold calcium spikes and $7 - 14\\,\\mathrm{Hz}$ sleep spindle oscillations that disconnect sensory throughput from cortical processing. In this paper, we formalize TRN cross-modal attentional filtering and burst-tonic mode gating within the WEFT formal verification suite. We prove that prefrontal attentional biases sculpt opponent lateral inhibition across thalamic modalities and that cholinergic depolarization strictly enforces faithful linear transmission mode. We formalize these gating theorems in Lean 4 without empirical axioms, benchmark the vectorized AVX2 SIMD microkinematics yielding throughput exceeding 1,300 Melem/s, validate a high-performance Triton 3.9 GPU kernel, and demonstrate seamless cross-modal switching between visual focus, auditory orientation, and sleep spindle burst gating.", "formal_proof": "namespace Weft.Formal\n\n/-- State parameters representing thalamocortical relay nuclei and the reticular shell.\n    All drives, potentials, and GABA outputs are scaled natural units. -/\nstructure TRNState where\n  /-- Visual LGN ascending sensory drive (scaled Nat, 0 - 100) -/\n  visualInput : Nat\n  /-- Auditory MGN ascending sensory drive (scaled Nat, 0 - 100) -/\n  auditoryInput : Nat\n  /-- Prefrontal cortex attentional bias towards visual modality (scaled Nat, 0 - 100, where 50 is neutral) -/\n  pfcVisualBias : Nat\n  /-- Effective thalamic membrane potential (scaled Nat, 0 - 100 representing -75 mV to -55 mV, threshold at 50 = -65 mV) -/\n  membranePotential : Nat\n  /-- Ascending cholinergic/noradrenergic arousal drive -/\n  arousalDrive : Nat\n  deriving Repr\n\n/-- Threshold potential separating low-threshold T-type Ca2+ burst mode (< 50) from tonic mode (>= 50) -/\ndef burstThreshold : Nat := 50\n\n/-- Is thalamic relay currently operating in low-threshold T-type Ca2+ burst mode? -/\ndef isBurstMode (s : TRNState) : Bool :=\n  s.membranePotential + s.arousalDrive < burstThreshold\n\n/-- TRN Visual Sector GABAergic Output:\n    Suppressed by high PFC visual bias (disinhibiting LGN):\n    GABA_vis = if 100 >= pfcVisualBias then 100 - pfcVisualBias else 0 -/\ndef trnVisualGABA (s : TRNState) : Nat :=\n  if 100 >= s.pfcVisualBias then 100 - s.pfcVisualBias else 0\n\n/-- TRN Auditory Sector GABAergic Output:\n    Elevated by high PFC visual bias (inhibiting MGN):\n    GABA_aud = pfcVisualBias -/\ndef trnAuditoryGABA (s : TRNState) : Nat :=\n  s.pfcVisualBias\n\n/-- Effective Visual LGN Relay Output Transmission:\n    In tonic mode: Trans_vis = (visualInput * 2) - (trnVisualGABA / 2)\n    In burst mode: Clamped to non-linear burst value if input > 0 -/\ndef visualRelayTransmission (s : TRNState) : Nat :=\n  if isBurstMode s then\n    if s.visualInput > 0 then 80 else 0\n  else\n    let drive := s.visualInput * 2\n    let inh := trnVisualGABA s / 2\n    if drive > inh then drive - inh else 0\n\n/-- Effective Auditory MGN Relay Output Transmission:\n    In tonic mode: Trans_aud = (auditoryInput * 2) - (trnAuditoryGABA / 2)\n    In burst mode: Clamped to non-linear burst value if input > 0 -/\ndef auditoryRelayTransmission (s : TRNState) : Nat :=\n  if isBurstMode s then\n    if s.auditoryInput > 0 then 80 else 0\n  else\n    let drive := s.auditoryInput * 2\n    let inh := trnAuditoryGABA s / 2\n    if drive > inh then drive - inh else 0\n\n/-- Theorem 1: TRN GABA outputs are invariant-bounded within [0, 100]. -/\ntheorem trn_gaba_bounded (s : TRNState) (h_bias : s.pfcVisualBias <= 100) :\n    trnVisualGABA s <= 100 /\\ trnAuditoryGABA s <= 100 := by", "figure_1_png": "docs/figures/figure_paper_201.png", "figure_1_svg": "docs/figures/figure_paper_201.svg", "figure_2_png": "docs/figures/figure_paper_201_validation.png", "figure_2_svg": "docs/figures/figure_paper_201_validation.svg"}, {"paper_number": 202, "target_number": 393, "title": "Claustrum Cortical Synchronization & Salience Switching Invariants", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #393: ClaustrumSynchronyInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "The claustrum is a thin, telencephalic subcortical gray

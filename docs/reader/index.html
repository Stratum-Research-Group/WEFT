png": "docs/figures/figure_paper_165_validation.png", "figure_2_svg": "docs/figures/figure_paper_165_validation.svg"}, {"paper_number": 166, "target_number": 357, "title": "Heterosynaptic Coincidence Detection, Cerebellar LTD, and Error-Driven Motor Adaptation: Biophysical Formulations and High-Throughput Triton Implementations", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #357: CerebellarLTDInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Cerebellar motor learning coordinates fine motor execution, vestibulo-ocular reflex (VOR) stabilization, and saccadic adaptation via error-driven synaptic plasticity at parallel fiber (PF) to Purkinje cell (PC) synapses. Long-Term Depression (LTD) at these synapses is mediated by heterosynaptic coincidence detection: simultaneous activation of metabotropic glutamate receptors (mGluR1) via granule cell parallel fibers and massive dendritic $\\text{Ca}^{2+}$ influx via climbing fibers (CF) originating from the inferior olive. This coincidence engages an intracellular signaling cascade involving inositol 1,4,5-trisphosphate ($\\text{IP}_3$), diacylglycerol ($\\text{DAG}$), and protein kinase C alpha ($\\text{PKC}\\alpha$), leading to the clathrin-dependent endocytosis of postsynaptic AMPA receptors ($\\text{GluA2}$). Here, we formalize the mathematical invariants of heterosynaptic coincidence LTD, establish bounded convergence in Lean 4 (Target #357), develop a fused Triton 3.9 kernel along with an AVX2 SIMD microbenchmark processing over $9.6\\text{ GigaSynapses/s}$, and demonstrate closed-loop saccadic adaptation achieving $94.61\\%$ motor error reduction.", "formal_proof": "namespace Weft.Formal\n\n/-- Synaptic plasticity state of a Parallel Fiber - Purkinje Cell synapse. -/\ninductive SynapseState where\n  | quiescent : SynapseState\n  | ltp : SynapseState\n  | ltd : SynapseState\n  deriving Repr, DecidableEq\n\n/-- State representation of a parallel fiber synapse:\n    `weight`: Scaled weight in [100, 1000] (0.1 to 1.0)\n    `pfActivity`: 1 if active, 0 otherwise\n    `cfError`: 1 if climbing fiber fired error spike, 0 otherwise\n    `wMin`: lower bound (e.g. 100)\n    `wMax`: upper bound (e.g. 1000)\n-/\nstructure Synapse where\n  weight : Nat\n  pfActivity : Nat\n  cfError : Nat\n  wMin : Nat\n  wMax : Nat\n  h_bounds : wMin \u2264 weight \u2227 weight \u2264 wMax\n  h_min_pos : wMin > 0\n  h_order : wMin < wMax\n  deriving Repr\n\n/-- Coincidence condition: Both Parallel Fiber and Climbing Fiber are simultaneously active. -/\ndef isCoincident (s : Synapse) : Prop :=\n  s.pfActivity > 0 \u2227 s.cfError > 0\n\n/-- Evaluate step-wise plasticity update:\n    If coincident (PF active AND CF error), apply depression `eta_ltd`.\n    If PF active AND NOT CF error, apply slight potentiation `eta_ltp`.\n    Otherwise no change.\n-/\ndef updateWeight (s : Synapse) (eta_ltd : Nat) (eta_ltp : Nat) : Nat :=\n  if s.pfActivity > 0 \u2227 s.cfError > 0 then\n    if s.weight \u2265 s.wMin + eta_ltd then s.weight - eta_ltd else s.wMin\n  else if s.pfActivity > 0 \u2227 s.cfError = 0 then\n    if s.weight + eta_ltp \u2264 s.wMax then s.weight + eta_ltp else s.wMax\n  else\n    s.weight\n\n/-- Theorem: Under heterosynaptic coincidence (PF > 0 and CF > 0), the updated weight\n    is strictly less than or equal to the original weight, and remains bounded by wMin. -/", "figure_1_png": "docs/figures/figure_paper_166.png", "figure_1_svg": "docs/figures/figure_paper_166.svg", "figure_2_png": "docs/figures/figure_paper_166_validation.png", "figure_2_svg": "docs/figures/figure_paper_166_validation.svg"}, {"paper_number": 167, "target_number": 358, "title": "Cerebro-Cerebellar Closed-Loop Connectivity, Pontine Collaterals, and Smith Predictor Internal Models in Sensorimotor Control", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #358: CerebroCerebellarSmithPredictorInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Rapid sensorimotor execution is fundamentally constrained by biological conduction delays ($50\\text{--}150\\text{ ms}$) in sensory feedback loops, rendering pure closed-loop feedback control unstable during ballistic movements. The mammalian nervous system circumvents this limitation by implementing forward internal models within cerebro-cerebellar closed loops. Primary motor cortex (M1) projects descending motor commands along the corticospinal tract while branching dense collateral copies through the basilar pontine nuclei to the cerebellar cortex. The cerebellar microcircuitry acts as a high-speed internal simulator (a biological Smith predictor), synthesizing expected sensory consequences (reafference) prior to peripheral arrival. Subtraction of predicted reafference from actual sensory feedback attenuates self-generated sensations while selectively transmitting unexpected external perturbations (exafference) to higher cortical centers. In this work, we formalize the stability invariants of forward internal models, verify them in Lean 4 (Target #358), develop a fused Triton 3.9 predictor kernel and an AVX2 SIMD microbenchmark, and demonstrate $97.09\\%$ sensory reafference cancellation with robust perturbation detection.", "formal_proof": "namespace Weft.Formal\n\n/-- Sensory reafference status:\n    - `cancelled`: Self-generated sensory consequences successfully attenuated.\n    - `exafferentAlert`: Significant discrepancy indicates unexpected external perturbation.\n-/\ninductive SensoryStatus where\n  | cancelled : SensoryStatus\n  | exafferentAlert : SensoryStatus\n  deriving Repr, DecidableEq\n\n/-- State representation of the forward sensorimotor comparator:\n    `u_motor`: Scaled motor command magnitude [0, 1000]\n    `y_actual`: Actual incoming sensory feedback [0, 2000]\n    `y_pred`: Forward model predicted sensory consequence [0, 2000]\n    `error_threshold`: Discrepancy boundary separating self-action from external perturbation\n-/\nstructure ForwardModelState where\n  u_motor : Nat\n  y_actual : Nat\n  y_pred : Nat\n  error_threshold : Nat\n  h_thresh_pos : error_threshold > 0\n  deriving Repr\n\n/-- Calibrated Forward Model Invariant:\n    A forward model is calibrated when its prediction error |y_actual - y_pred|\n    for purely self-generated movements (no external force) is strictly below the threshold.\n-/\ndef isCalibrated (s : ForwardModelState) : Prop :=\n  (s.y_actual \u2265 s.y_pred \u2227 s.y_actual - s.y_pred \u2264 s.error_threshold) \u2228\n  (s.y_pred > s.y_actual \u2227 s.y_pred - s.y_actual \u2264 s.error_threshold)\n\n/-- Evaluate sensory cancellation gate:\n    If discrepancy is within threshold, the sensation is classified as cancelled.\n    Otherwise, an exafference alert is issued to parietal/somatosensory cortex.\n-/\ndef evaluateSensoryGate (s : ForwardModelState) : SensoryStatus :=\n  let discrepancy := if s.y_actual \u2265 s.y_pred then s.y_actual - s.y_pred else s.y_pred - s.y_actual\n  if discrepancy \u2264 s.error_threshold then\n    SensoryStatus.cancelled\n  else\n    SensoryStatus.exafferentAlert\n\n/-- Theorem: For any calibrated forward model state, self-generated sensory reafference\n    is unconditionally attenuated to `SensoryStatus.cancelled`. -/\ntheorem calibrated_model_cancels_reafference\n    (s : ForwardModelState)\n    (h_calib : isCalibrated s) :\n    evaluateSensoryGate s = SensoryStatus.cancelled := by", "figure_1_png": "docs/figures/figure_paper_167.png", "figure_1_svg": "docs/figures/figure_paper_167.svg", "figure_2_png": "docs/figures/figure_paper_167_validation.png", "figure_2_svg": "docs/figures/figure_paper_167_validation.svg"}, {"paper_number": 168, "target_number": 359, "title": "Spinal Central Pattern Generators, Renshaw Cell Recurrent Inhibition, and Reciprocal Ia Antagonist Coordination: Biophysical Modeling and High-Throughput Triton Implementations", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #359: SpinalCPGReciprocalInhibitionInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Coordinated locomotion and ballistic limb articulation require precise mutual exclusion between agonist and antagonist skeletal muscle groups. In the ventral horn of the spinal cord, alpha motor neurons innervating flexor muscles cross-inhibit extensor motor neurons via glycinergic Ia reciprocal inhibitory interneurons, while collateral axon branches activate Renshaw cells that provide negative recurrent feedback. This coupled inhibitory microcircuitry prevents deleterious muscular co-contraction, shapes motor discharge gain, and provides the downstream substrate driven by spinal central pattern generators (CPGs) and descending brainstem reticulospinal/rubrospinal commands. In this paper, we formalize the mathematical invariants of agonist-antagonist reciprocal exclusion, prove that reciprocal inhibition unconditionally suppresses co-contraction in Lean 4 (Target #359), design a fused Triton 3.9 GPU kernel and an AVX2 SIMD microbenchmark executing at $0.804\\ \\mu\\text{s}$ per iteration across 2,048 motor pools, and demonstrate flawless phase alternation ($0$ co-contraction violations) in closed-loop locomotor simulations.", "formal_proof": "namespace Weft.Formal\n\n/-- Coordination state of an agonist-antagonist motor pool pair:\n    - `reciprocallyGated`: Exactly one pool is dominant; the other is strictly suppressed.\n    - `coContracting`: Both pools active simultaneously (unstable or co-activated).\n-/\ninductive CoordinationState where\n  | reciprocallyGated : CoordinationState\n  | coContracting : CoordinationState\n  deriving Repr, DecidableEq\n\n/-- State representation of flexor and extensor motor pool rates:\n    `flexRate`: Flexor alpha motor neuron firing rate (Hz)\n    `extRate`: Extensor alpha motor neuron firing rate (Hz)\n    `suppressionCeiling`: Maximum residual firing allowed in the suppressed antagonist pool (e.g. 15 Hz)\n    `activeThreshold`: Minimum firing required to be considered the active driver (e.g. 50 Hz)\n-/\nstructure MotorPoolPair where\n  flexRate : Nat\n  extRate : Nat\n  suppressionCeiling : Nat\n  activeThreshold : Nat\n  h_order : suppressionCeiling < activeThreshold\n  deriving Repr\n\n/-- Invariant for Reciprocal Mutual Exclusion:\n    A motor pool pair is in a valid reciprocal state if whenever one pool fires\n    above the activeThreshold, the opposing antagonist is suppressed below the suppressionCeiling.\n-/\ndef isReciprocallyExclusive (p : MotorPoolPair) : Prop :=\n  (p.flexRate \u2265 p.activeThreshold \u2192 p.extRate \u2264 p.suppressionCeiling) \u2227\n  (p.extRate \u2265 p.activeThreshold \u2192 p.flexRate \u2264 p.suppressionCeiling)\n\n/-- Step transition evaluating agonist-antagonist coordination state. -/\ndef evaluateCoordinationState (p : MotorPoolPair) : CoordinationState :=\n  if p.flexRate \u2265 p.activeThreshold \u2227 p.extRate \u2265 p.activeThreshold then\n    CoordinationState.coContracting\n  else\n    CoordinationState.reciprocallyGated\n\n/-- Theorem: If a motor pool pair satisfies the reciprocal mutual exclusion invariant,\n    it cannot co-contract above the active threshold. -/\ntheorem reciprocal_exclusion_prevents_co_contraction\n    (p : MotorPoolPair)\n    (h_recip : isReciprocallyExclusive p) :\n    evaluateCoordinationState p = CoordinationState.reciprocallyGated := by", "figure_1_png": "docs/figures/figure_paper_168.png", "figure_1_svg": "docs/figures/figure_paper_168.svg", "figure_2_png": "docs/figures/figure_paper_168_validation.png", "figure_2_svg": "docs/figures/figure_paper_168_validation.svg"}, {"paper_number": 169, "target_number": 360, "title": "Quantal Neurotransmitter Release at the Mammalian Neuromuscular Junction: Calcium Cooperativity, Acetylcholinesterase Clearance, and High-Throughput Triton Implementations", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #360: NMJQuantalReleaseInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "The neuromuscular junction (NMJ) is the specialized peripheral synapse connecting lower motor neuron axon terminals to skeletal muscle sarcolemma. Transmission reliability is governed by the quantal release of acetylcholine (ACh) stored within presynaptic synaptic vesicles. Upon motoneuron action potential arrival, voltage-gated P/Q- and N-type calcium channels ($\\text{Ca}_V2.1/\\text{Ca}_V2.2$) open, producing nanodomains of elevated intracellular calcium ($[\\text{Ca}^{2+}]_i \\approx 10\\text{--}50\\ \\mu\\text{M}$) that trigger synaptotagmin-1 SNARE complex zippering via 4th-power cooperativity. Each exocytosed vesicle delivers a single quantum ($\\sim 10^4$ ACh molecules) into the $50\\text{ nm}$ synaptic cleft, generating a miniature endplate potential ($\\text{MEPP} \\approx 0.7\\text{ mV}$). Synchronous exocytosis of $50\\text{--}80$ quanta elicits an Endplate Potential ($\\text{EPP} \\approx 35\\text{--}55\\text{ mV}$) that comfortably exceeds the $\\sim 25\\text{ mV}$ depolarization threshold required to trigger voltage-gated $\\text{Na}_V1.4$ sarcolemmal action potentials (a biological safety factor of $1.5\\text{--}2.2\\times$). In this work, we formalize the quantal safety factor invariants in Lean 4 (Target #360), develop a fused Triton 3.9 GPU kernel and an AVX2 SIMD microbenchmark executing at $0.0034\\ \\mu\\text{s}$ per iteration across 16,384 endplates, and demonstrate twitch force summation ($2.96\\times$ tetanic fusion ratio) in electromyographic simulations.", "formal_proof": "namespace Weft.Formal\n\n/-- Muscle fiber transmission outcome:\n    - `actionPotentialElicited`: Full sarcolemmal all-or-none depolarization and twitch.\n    - `transmissionFailure`: Subthreshold EPP failing to evoke mechanical contraction.\n-/\ninductive NMJTransmissionOutcome where\n  | actionPotentialElicited : NMJTransmissionOutcome\n  | transmissionFailure : NMJTransmissionOutcome\n  deriving Repr, DecidableEq\n\n/-- State representation of an NMJ endplate:\n    `quanta`: Number of ACh vesicles exocytosed (scaled Nat)\n    `quantumSize`: Depolarization per vesicle in millivolts (e.g. 7 for 0.7 mV scaled by 10)\n    `threshold`: Depolarization required to open Nav1.4 channels (e.g. 250 for 25.0 mV)\n    `minSafetyFactorQuanta`: Minimum quanta guaranteeing safety factor >= 1.0\n-/\nstructure NMJEndplateState where\n  quanta : Nat\n  quantumSize : Nat\n  threshold : Nat\n  minSafetyFactorQuanta : Nat\n  h_thresh_pos : threshold > 0\n  h_size_pos : quantumSize > 0\n  h_safety_def : minSafetyFactorQuanta * quantumSize \u2265 threshold\n  deriving Repr\n\n/-- Invariant for Healthy Mammalian NMJ Safety Factor:\n    An endplate satisfies the safety factor invariant if the released quantal content\n    meets or exceeds the minimum safety threshold (m >= minSafetyFactorQuanta).\n-/\ndef satisfiesSafetyFactor (s : NMJEndplateState) : Prop :=\n  s.quanta \u2265 s.minSafetyFactorQuanta\n\n/-- Evaluate endplate transmission outcome based on total Endplate Potential (EPP). -/\ndef evaluateNMJTransmission (s : NMJEndplateState) : NMJTransmissionOutcome :=\n  let epp := s.quanta * s.quantumSize\n  if epp \u2265 s.threshold then\n    NMJTransmissionOutcome.actionPotentialElicited\n  else\n    NMJTransmissionOutcome.transmissionFailure\n\n/-- Theorem: For any NMJ endplate satisfying the biological safety factor invariant,\n    the resulting Endplate Potential unconditionally elicits a muscle action potential. -/\ntheorem safety_factor_guarantees_muscle_ap\n    (s : NMJEndplateState)\n    (h_sf : satisfiesSafetyFactor s) :\n    evaluateNMJTransmission s = NMJTransmissionOutcome.actionPotentialElicited := by", "figure_1_png": "docs/figures/figure_paper_169.png", "figure_1_svg": "docs/figures/figure_paper_169.svg", "figure_2_png": "docs/figures/figure_paper_169_validation.png", "figure_2_svg": "docs/figures/figure_paper_169_validation.svg"}, {"paper_number": 170, "target_number": 361, "title": "Muscle Spindles, Gamma Motoneuron Fusimotor Bias, and the Monosynaptic Myotatic Stretch Reflex: Biophysical Foundations and High-Throughput Triton Implementations", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #361: MuscleSpindleFusimotorInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Posture stabilization and sudden kinematic perturbation compensation in terrestrial vertebrates rely upon proprioceptive mechanosensory feedback from intrafusal muscle spindles. The mammalian spindle encapsulates specialized intrafusal fibers (nuclear bag1, nuclear bag2, and nuclear chain fibers) arranged in parallel with extrafusal skeletal muscle. Primary Group Ia sensory afferents innervate central equatorial regions with spiral annulospiral endings, exhibiting exquisite non-linear sensitivity to lengthening velocity ($v^{0.6}$), while secondary Group II flower-spray endings predominantly encode static muscle length ($L - L_0$). Gamma ($\\gamma$) motoneurons project fusimotor axons to the contractile polar regions of intrafusal fibers: dynamic $\\gamma$ motoneurons selectively amplify Ia velocity sensitivity, whereas static $\\gamma$ motoneurons elevate tonic position discharge. In the spinal cord, Group Ia afferents establish monosynaptic excitatory glutamatergic connections with homonymous alpha ($\\alpha$) motor neurons, forming the classical myotatic stretch reflex (Sherrington loop). In this paper, we formalize the mathematical invariants of spindle proprioceptive transduction, prove monotonic velocity recruitment in Lean 4 (Target #361), construct a fused Triton 3.9 GPU kernel and an AVX2 SIMD microbenchmark executing at $0.00526\\ \\mu\\text{s}$ per iteration across 32,768 spindle sensors ($6.23\\times 10^6\\text{ MSpindles/s}$), and validate closed-loop tendon tap perturbation recovery ($166.26\\text{ Hz}$ peak Ia burst restoring equilibrium) in closed-loop biomechanical simulations.", "formal_proof": "namespace Weft.Formal\n\n/-- Reflex loop state:\n    - `reflexRecruited`: Suprathreshold Ia discharge commanding compensatory motor contraction.\n    - `quiescent`: Subthreshold baseline proprioceptive state.\n-/\ninductive ReflexState where\n  | reflexRecruited : ReflexState\n  | quiescent : ReflexState\n  deriving Repr, DecidableEq\n\n/-- State representation of a muscle spindle unit:\n    `lengthDelta`: Lengthening displacement (L - L0) scaled as Nat\n    `velocity`: Lengthening velocity (dL/dt) scaled as Nat\n    `gammaDynamic`: Dynamic fusimotor drive scaled as Nat\n    `k_pos`: Positional sensitivity coefficient\n    `k_vel`: Velocity sensitivity coefficient\n    `baseDischarge`: Spontaneous baseline firing rate (e.g. 35 Hz)\n    `reflexThreshold`: Depolarization threshold required to recruit homonymous alpha MNs\n-/\nstructure MuscleSpindleState where\n  lengthDelta : Nat\n  velocity : Nat\n  gammaDynamic : Nat\n  k_pos : Nat\n  k_vel : Nat\n  baseDischarge : Nat\n  reflexThreshold : Nat\n  h_k_pos_pos : k_pos > 0\n  h_k_vel_pos : k_vel > 0\n  h_thresh_order : baseDischarge \u2264 reflexThreshold\n  deriving Repr\n\n/-- Compute primary Group Ia afferent firing rate. -/\ndef computeIaRate (s : MuscleSpindleState) : Nat :=\n  s.baseDischarge + s.k_pos * s.lengthDelta + s.k_vel * (s.velocity * (1 + s.gammaDynamic))\n\n/-- Evaluate monosynaptic stretch reflex motor recruitment. -/\ndef evaluateStretchReflex (s : MuscleSpindleState) : ReflexState :=\n  if computeIaRate s \u2265 s.reflexThreshold then\n    ReflexState.reflexRecruited\n  else\n    ReflexState.quiescent\n\n/-- Theorem: Large lengthening velocity or stretch perturbations unconditionally recruit\n    the monosynaptic myotatic reflex. -/\ntheorem rapid_stretch_triggers_reflex\n    (s : MuscleSpindleState)\n    (h_fast : s.k_vel * (s.velocity * (1 + s.gammaDynamic)) \u2265 s.reflexThreshold) :\n    evaluateStretchReflex s = ReflexState.reflexRecruited := by", "figure_1_png": "docs/figures/figure_paper_170.png", "figure_1_svg": "docs/figures/figure_paper_170.svg", "figure_2_png": "docs/figures/figure_paper_170_validation.png", "figure_2_svg": "docs/figures/figure_paper_170_validation.svg"}, {"paper_number": 171, "target_number": 362, "title": "Golgi Tendon Organs, Group Ib Interneurons, and Autogenic Inverse Myotatic Inhibition: Force Regulation, Tendon Protection, and High-Throughput Triton Implementations", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #362: GolgiTendonOrganIbInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "While muscle spindles operate in parallel with extrafusal muscle fibers to monitor muscular length and velocity, Golgi Tendon Organs (GTOs) are encapsulated mechanoreceptors located in series at the myotendinous junction, exquisitely tuned to active muscular contractile force. Tensile deformation straightens braided collagen fascicles, pinching unmyelinated intertwining sensory endings of primary Group Ib afferent fibers. In the spinal intermediate zone, Group Ib afferents synapse onto glycinergic Ib inhibitory interneurons that project directly to homonymous alpha motor neurons, mediating the classic autogenic (inverse myotatic) reflex. This negative feedback loop fulfills two complementary physiological functions: continuous proportional force compensation (compliance smoothing) under moderate loads, and protective \"clasp-knife\" reflex shutoff under extreme, non-physiological tension to avert tendon rupture or avulsion fractures. In this work, we formalize the mathematical invariants of in-series force regulation and clasp-knife protection in Lean 4 (Target #362), develop a fused Triton 3.9 GPU kernel and an AVX2 SIMD microbenchmark executing at $0.0131\\ \\mu\\text{s}$ per iteration across 32,768 muscle-tendon units ($2.50\\times 10^6\\text{ MTendons/s}$), and demonstrate $100\\%$ protective motor shutoff under critical tensile overload in dynamical biomechanical simulations.", "formal_proof": "namespace Weft.Formal\n\n/-- Musculoskeletal force state:\n    - `tensionRegulated`: Normal force servo operation with autogenic damping.\n    - `claspKnifeReleased`: Overload threshold exceeded, requiring total motor cessation.\n-/\ninductive TendonProtectionState where\n  | tensionRegulated : TendonProtectionState\n  | claspKnifeReleased : TendonProtectionState\n  deriving Repr, DecidableEq\n\n/-- State representation of a Golgi Tendon Organ feedback loop:\n    `tension`: Muscle contractile tension (Newtons, scaled as Nat)\n    `descendingDrive`: Motor command drive (Hz, scaled as Nat)\n    `k_Ib`: Force-to-discharge gain constant\n    `w_Ib`: Inhibitory synaptic weight onto alpha motor pool\n    `criticalTension`: Rupture/avulsion hazard threshold\n-/\nstructure GTOFeedbackState where\n  tension : Nat\n  descendingDrive : Nat\n  k_Ib : Nat\n  w_Ib : Nat\n  criticalTension : Nat\n  h_k_pos : k_Ib > 0\n  h_w_pos : w_Ib > 0\n  h_crit_pos : criticalTension > 0\n  deriving Repr\n\n/-- Compute primary Group Ib afferent firing rate (linearized scaled approximation). -/\ndef computeIbRate (s : GTOFeedbackState) : Nat :=\n  s.k_Ib * s.tension\n\n/-- Compute di-synaptic autogenic inhibition acting upon alpha motor pool. -/\ndef computeAutogenicInhibition (s : GTOFeedbackState) : Nat :=\n  s.w_Ib * computeIbRate s\n\n/-- Evaluate tendon protection state:\n    If tension meets or exceeds criticalTension, claspKnifeReleased is triggered.\n    Otherwise, tension remains regulated under physiological feedback.\n-/\ndef evaluateTendonProtection (s : GTOFeedbackState) : TendonProtectionState :=\n  if s.tension \u2265 s.criticalTension then\n    TendonProtectionState.claspKnifeReleased\n  else\n    TendonProtectionState.tensionRegulated\n\n/-- Calculate net motor pool output drive:\n    In claspKnifeReleased, drive is clamped unconditionally to zero.\n    In tensionRegulated, drive is diminished by autogenic inhibition.", "figure_1_png": "docs/figures/figure_paper_171.png", "figure_1_svg": "docs/figures/figure_paper_171.svg", "figure_2_png": "docs/figures/figure_paper_171_validation.png", "figure_2_svg": "docs/figures/figure_paper_171_validation.svg"}, {"paper_number": 172, "target_number": 363, "title": "Polysynaptic Spinal Reflex Pathways, Flexor Reflex Afferents (FRA), and the Crossed-Extensor Postural Preservation Circuit: Biophysical Modeling and High-Throughput Triton Implementations", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #363: CrossedExtensorReflexInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Survival in complex terrestrial environments demands instantaneous motor withdrawal from noxious or damaging environmental stimuli (such as thermal burns or sharp punctures). The classical flexor withdrawal reflex is mediated by high-threshold cutaneous Flexor Reflex Afferents (FRA, primarily A-delta and unmyelinated C fibers) that project polysynaptically through the spinal dorsal horn. While withdrawal of the threatened limb requires rapid activation of ipsilateral flexors and reciprocal inhibition of ipsilateral extensors, lifting a weight-bearing limb risks catastrophic postural collapse unless immediately compensated by the contralateral limb. To preserve postural equilibrium, commissural interneurons (derived from embryonic V0 and V3 lineages) decussate across the anterior spinal commissure, driving intense contralateral extensor contraction (crossed-extensor reflex thrust) and reciprocal inhibition of contralateral flexors. In this paper, we formalize the bilateral postural stability invariants in Lean 4 (Target #363), develop a fused Triton 3.9 GPU kernel and an AVX2 SIMD microbenchmark executing at $0.0120\\ \\mu\\text{s}$ per iteration across 16,384 bilateral circuits ($1.36\\times 10^6\\text{ MCircuits/s}$), and demonstrate flawless postural compensation ($150\\text{ Hz}$ ipsilateral withdrawal paired with $195\\text{ Hz}$ contralateral extensor thrust) in dynamical sensorimotor simulations.", "formal_proof": "namespace Weft.Formal\n\n/-- Bilateral limb postural reflex state:\n    - `symmetricStance`: Normal quiet stance or locomotor stepping.\n    - `withdrawalExtensorThrust`: Unilateral noxious withdrawal with contralateral postural compensation.\n-/\ninductive BilateralPosturalState where\n  | symmetricStance : BilateralPosturalState\n  | withdrawalExtensorThrust : BilateralPosturalState\n  deriving Repr, DecidableEq\n\n/-- State representation of bilateral spinal reflex circuit:\n    `noxiousIntensity`: Pain afferent firing intensity (e.g. 0 to 200)\n    `noxiousThreshold`: Threshold for eliciting protective withdrawal (e.g. 50)\n    `ipsiFlex`: Ipsilateral flexor motor pool rate (Hz)\n    `ipsiExt`: Ipsilateral extensor motor pool rate (Hz)\n    `contraExt`: Contralateral extensor motor pool rate (Hz)\n    `contraFlex`: Contralateral flexor motor pool rate (Hz)\n    `activeThreshold`: Minimum rate defining active muscular contraction (e.g. 80 Hz)\n    `suppressionCeiling`: Maximum rate permitted in suppressed antagonist (e.g. 10 Hz)\n-/\nstructure BilateralReflexState where\n  noxiousIntensity : Nat\n  noxiousThreshold : Nat\n  ipsiFlex : Nat\n  ipsiExt : Nat\n  contraExt : Nat\n  contraFlex : Nat\n  activeThreshold : Nat\n  suppressionCeiling : Nat\n  h_thresh_order : suppressionCeiling < activeThreshold\n  h_nox_pos : noxiousThreshold > 0\n  deriving Repr\n\n/-- Invariant for Valid Crossed-Extensor Coordination:\n    When noxious stimulus meets or exceeds threshold:\n    1. Ipsilateral flexor is active (>= activeThreshold) and ipsilateral extensor suppressed (<= suppressionCeiling).\n    2. Contralateral extensor is active (>= activeThreshold) and contralateral flexor suppressed (<= suppressionCeiling).\n-/\ndef satisfiesCrossedExtensorInvariant (s : BilateralReflexState) : Prop :=\n  s.noxiousIntensity \u2265 s.noxiousThreshold \u2192\n  (s.ipsiFlex \u2265 s.activeThreshold \u2227 s.ipsiExt \u2264 s.suppressionCeiling \u2227\n   s.contraExt \u2265 s.activeThreshold \u2227 s.contraFlex \u2264 s.suppressionCeiling)\n\n/-- Evaluate bilateral postural state. -/\ndef evaluatePosturalState (s : BilateralReflexState) : BilateralPosturalState :=\n  if s.noxiousIntensity \u2265 s.noxiousThreshold then\n    BilateralPosturalState.withdrawalExtensorThrust\n  else\n    BilateralPosturalState.symmetricStance\n\n/-- Theorem: For any bilateral reflex state satisfying the crossed-extensor invariant,\n    suprathreshold noxious stimulation guarantees ipsilateral withdrawal and contralateral stance thrust. -/\ntheorem noxious_stimulus_guarantees_postural_compensation\n    (s : BilateralReflexState)\n    (h_inv : satisfiesCrossedExtensorInvariant s)\n    (h_pain : s.noxiousIntensity \u2265 s.noxiousThreshold) :\n    evaluatePosturalState s = BilateralPosturalState.withdrawalExtensorThrust \u2227\n    s.ipsiFlex \u2265 s.activeThreshold \u2227\n    s.contraExt \u2265 s.activeThreshold := by", "figure_1_png": "docs/figures/figure_paper_172.png", "figure_1_svg": "docs/figures/figure_paper_172.svg", "figure_2_png": "docs/figures/figure_paper_172_validation.png", "figure_2_svg": "docs/figures/figure_paper_172_validation.svg"}, {"paper_number": 173, "target_number": 364, "title": "Vestibulospinal Pathways, Otolith Graviceptive Gating, and Semicircular Canal Angular Dynamics: Antigravity Postural Stabilization and High-Throughput Triton Implementations", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #364: VestibulospinalPosturalInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Bipedal and quadrupedal postural equilibrium depends critically upon descending vestibulospinal projections that transform inner ear vestibular signals into continuous antigravity muscular tone. The labyrinthine vestibular apparatus incorporates two complementary sensory systems: the otolith organs (utricle and saccule), which transduce linear head accelerations and gravitational shear via dense calcium carbonate otoconia sliding over sensory maculae, and the three orthogonal semicircular canals (horizontal, anterior, and posterior), which transduce rotational angular velocity via endolymph fluid displacement against gelatinous cupulae. Primary vestibular afferents project into the vestibular nuclear complex of the brainstem, bifurcating into two major descending pathways:\n1. **The Lateral Vestibulospinal Tract (LVST):** Arises predominantly from the lateral vestibular nucleus of Deiters, descending uncrossed down the entire length of the spinal cord to establish monosynaptic and oligosynaptic excitatory connections with alpha and gamma motor neurons innervating ipsilateral axial and limb extensor muscles.\n2. **The Medial Vestibulospinal Tract (MVST):** Arises from the medial and descending vestibular nuclei, projecting bilaterally through the medial longitudinal fasciculus (MLF) into the cervical spinal cord to mediate the vestibulocollic reflex (VCR), stabilizing head-in-space posture.\n\nIn this work, we formalize the invariants of vestibulospinal gravitational compensation in Lean 4 (Target #364), develop a fused Triton 3.9 GPU kernel and an AVX2 SIMD microbenchmark executing at $0.0082\\ \\mu\\text{s}$ per iteration across 32,768 vestibular sensory-motor units ($3.988\\times 10^6\\text{ MUnits/s}$), and validate closed-loop postural righting ($161.85\\text{ Hz}$ peak LVST extensor drive restoring vertical alignment within $150\\text{ ms}$) in full biomechanical simulations.", "formal_proof": "namespace Weft.Formal\n\n/-- Postural righting state:\n    - `postureAligned`: Head and body upright within nominal vertical cone.\n    - `extensorRightingRecruited`: Suprathreshold tilt commanding LVST antigravity extensor drive.\n-/\ninductive VestibulospinalState where\n  | postureAligned : VestibulospinalState\n  | extensorRightingRecruited : VestibulospinalState\n  deriving Repr, DecidableEq\n\n/-- State representation of vestibulospinal postural circuit:\n    `tiltAngle`: Head tilt relative to vertical (scaled as Nat, e.g. degrees)\n    `tiltThreshold`: Maximum unperturbed sway angle before righting reflex engages (e.g. 10 deg)\n    `baseExtensorTone`: Basal antigravity tone in quiet stance (e.g. 45 Hz)\n    `k_lvst`: LVST recruitment sensitivity gain\n    `antigravityThreshold`: Minimum drive defining active righting thrust (e.g. 80 Hz)\n-/\nstructure VestibulospinalLoopState where\n  tiltAngle : Nat\n  tiltThreshold : Nat\n  baseExtensorTone : Nat\n  k_lvst : Nat\n  antigravityThreshold : Nat\n  h_k_pos : k_lvst > 0\n  h_thresh_order : baseExtensorTone < antigravityThreshold\n  h_tilt_pos : tiltThreshold > 0\n  h_recruitment_gain : baseExtensorTone + k_lvst * tiltThreshold \u2265 antigravityThreshold\n  deriving Repr\n\n/-- Compute descending Lateral Vestibulospinal Tract (LVST) antigravity extensor drive. -/\ndef computeLVSTDrive (s : VestibulospinalLoopState) : Nat :=\n  s.baseExtensorTone + s.k_lvst * s.tiltAngle\n\n/-- Evaluate vestibulospinal postural righting state. -/\ndef evaluateVestibulospinalState (s : VestibulospinalLoopState) : VestibulospinalState :=\n  if s.tiltAngle \u2265 s.tiltThreshold then\n    VestibulospinalState.extensorRightingRecruited\n  else\n    VestibulospinalState.postureAligned\n\n/-- Theorem: For any head tilt meeting or exceeding the perturbation threshold,\n    the vestibulospinal circuit unconditionally triggers `extensorRightingRecruited`\n    with LVST extensor drive meeting or exceeding the antigravity threshold. -/\ntheorem tilt_triggers_extensor_righting\n    (s : VestibulospinalLoopState)\n    (h_tilt : s.tiltAngle \u2265 s.tiltThreshold) :\n    evaluateVestibulospinalState s = VestibulospinalState.extensorRightingRecruited \u2227\n    computeLVSTDrive s \u2265 s.antigravityThreshold := by", "figure_1_png": "docs/figures/figure_paper_173.png", "figure_1_svg": "docs/figures/figure_paper_173.svg", "figure_2_png": "docs/figures/figure_paper_173_validation.png", "figure_2_svg": "docs/figures/figure_paper_173_validation.svg"}, {"paper_number": 174, "target_number": 365, "title": "Reticulospinal Projections, Anticipatory Postural Adjustments (APAs), and Pontomedullary Motor Gating: Feedforward Synergies and High-Throughput Triton Implementations", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #365: ReticulospinalAPAInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "When an organism executes a rapid, voluntary focal limb movement\u2014such as forward arm reaching or ballistic striking\u2014Newton's third law dictates that the accelerating limb exerts an equal and opposite reactive force onto the trunk and support base. Because somatosensory feedback latencies ($>50\\text{--}80\\text{ ms}$) arrive too late to prevent reactionary destabilization, the central nervous system employs feedforward **Anticipatory Postural Adjustments (APAs)**. Cortical motor planning areas, including the Supplementary Motor Area (SMA) and Premotor Cortex (PMC), issue dual parallel descending commands: an anticipatory postural command directed to the Pontomedullary Reticular Formation (PMRF), followed with a strict lead time ($\\Delta t_{\\text{lead}} \\approx 60\\text{--}100\\text{ ms}$) by the focal corticospinal command issued from Primary Motor Cortex (M1). The resulting Reticulospinal Tract (RST) volley activates bilateral axial and lower limb muscles (e.g. gastrocnemius, soleus, and erector spinae) prior to focal movement onset, creating preparatory counter-torque that cancels reactive forces. In this paper, we formalize the feedforward temporal precedence invariants in Lean 4 (Target #365), construct a fused Triton 3.9 GPU kernel and an AVX2 SIMD microbenchmark executing at $0.00576\\ \\mu\\text{s}$ per iteration across 32,768 motor synergies ($5.688\\times 10^6\\text{ MSynergies/s}$), and demonstrate near-perfect center-of-mass stabilization ($0.058\\text{ mm}$ displacement) in biomechanical reach-to-grasp simulations.", "formal_proof": "namespace Weft.Formal\n\n/-- Motor synergy execution phase:\n    - `posturalPreparationAPA`: Reticulospinal postural stabilizers active before focal movement.\n    - `focalActionExecution`: Corticospinal focal reach active alongside ongoing postural bracing.\n    - `quietBaseline`: No voluntary action intended.\n-/\ninductive MotorSynergyPhase where\n  | quietBaseline : MotorSynergyPhase\n  | posturalPreparationAPA : MotorSynergyPhase\n  | focalActionExecution : MotorSynergyPhase\n  deriving Repr, DecidableEq\n\n/-- State representation of feedforward anticipatory motor program:\n    `timeRelative`: Time relative to focal movement onset (ms shifted by offset: 0 = onset)\n    `t_apa_onset`: Time when reticulospinal APA engages (e.g. -75 ms)\n    `t_focal_onset`: Time when corticospinal focal reach engages (e.g. 0 ms)\n    `apaDrive`: Reticulospinal postural recruitment rate (Hz)\n    `focalDrive`: Corticospinal focal motor recruitment rate (Hz)\n    `activeThreshold`: Minimum rate defining active muscular contraction (e.g. 50 Hz)\n-/\nstructure APAProgramState where\n  currentTimeMs : Nat      -- Absolute timeline (e.g. t in ms)\n  t_apa_onset : Nat        -- APA onset timestamp (e.g. 100 ms)\n  t_focal_onset : Nat      -- Focal onset timestamp (e.g. 175 ms)\n  apaDrive : Nat\n  focalDrive : Nat\n  activeThreshold : Nat\n  h_lead_time : t_apa_onset < t_focal_onset\n  h_apa_recruited : currentTimeMs \u2265 t_apa_onset \u2192 apaDrive \u2265 activeThreshold\n  h_focal_delayed : currentTimeMs < t_focal_onset \u2192 focalDrive < activeThreshold\n  deriving Repr\n\n/-- Evaluate motor synergy phase based on timeline. -/\ndef evaluateSynergyPhase (s : APAProgramState) : MotorSynergyPhase :=\n  if s.currentTimeMs \u2265 s.t_focal_onset then\n    MotorSynergyPhase.focalActionExecution\n  else if s.currentTimeMs \u2265 s.t_apa_onset then\n    MotorSynergyPhase.posturalPreparationAPA\n  else\n    MotorSynergyPhase.quietBaseline\n\n/-- Theorem: During the feedforward anticipatory window (t_apa_onset <= t < t_focal_onset),\n    the reticulospinal APA is active while the corticospinal focal drive remains subthreshold. -/\ntheorem feedforward_precedence_guarantees_postural_lead\n    (s : APAProgramState)\n    (h_ge_apa : s.currentTimeMs \u2265 s.t_apa_onset)\n    (h_lt_focal : s.currentTimeMs < s.t_focal_onset) :\n    evaluateSynergyPhase s = MotorSynergyPhase.posturalPreparationAPA \u2227\n    s.apaDrive \u2265 s.activeThreshold \u2227\n    s.focalDrive < s.activeThreshold := by", "figure_1_png": "docs/figures/figure_paper_174.png", "figure_1_svg": "docs/figures/figure_paper_174.svg", "figure_2_png": "docs/figures/figure_paper_174_validation.png", "figure_2_svg": "docs/figures/figure_paper_174_validation.svg"}, {"paper_number": 175, "target_number": 366, "title": "The Rubrospinal Tract, Magnocellular Red Nucleus, and Cerebellar Interposed Synergy: Velocity Modulation in Distal Digit Control and High-Throughput Triton Implementations", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #366: RubrospinalDigitVelocityInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Fine manual dexterity and precision reach-to-grasp kinematics require continuous velocity modulation and active intention tremor dampening. While the phylogenetically newer corticospinal tract dominates individual digit fractionation in anthropoid primates, the ancient **Rubrospinal Tract (RST)**\u2014originating from giant multipolar projection neurons in the magnocellular red nucleus (RNm) of the midbrain tegmentum\u2014provides the critical subcortical substrate controlling distal limb velocity, forearm pronation/supination, and coordinated claw/finger flexion. The RNm acts as an obligate convergence hub integrating somatotopically aligned projections from primary motor cortex (M1 layer V corticorubral fibers) and the intermediate cerebellar cortex via the deep cerebellar interposed nuclei (emboliform and globose). Interposed neurons project across the superior cerebellar peduncle to excite RNm neurons, whose axons decussate immediately in the ventral tegmental decussation of Forel, descend within the lateral funiculus of the spinal cord, and terminate upon lateral motor pools in the cervical enlargement. In this paper, we formalize the velocity-scaling and tremor-dampening invariants of the rubrospinal system in Lean 4 (Target #366), develop a fused Triton 3.9 GPU kernel and an AVX2 SIMD microbenchmark executing at $0.00469\\ \\mu\\text{s}$ per iteration across 32,768 motor control units ($6.988\\times 10^6\\text{ MUnits/s}$), and demonstrate tremor-free terminal grasp deceleration ($2.075\\text{ mm}$ terminal oscillation, $0.38\\text{ cm}$ target error) in minimum-jerk kinematics simulations.", "formal_proof": "namespace Weft.Formal\n\n/-- Distal grasping state:\n    - `precisionGraspEngaged`: High-velocity controlled reach or firm terminal grasp.\n    - `quiescent`: Subthreshold manual resting state.\n-/\ninductive RubrospinalGraspState where\n  | precisionGraspEngaged : RubrospinalGraspState\n  | quiescent : RubrospinalGraspState\n  deriving Repr, DecidableEq\n\n/-- State representation of a rubrospinal motor control loop:\n    `velocity`: Distal limb velocity (scaled as Nat, e.g. cm/s)\n    `interposedDrive`: Cerebellar interposed nuclear firing rate (Hz)\n    `baseRNm`: Spontaneous basal RNm discharge rate (e.g. 35 Hz)\n    `k_vel`: Velocity sensitivity gain coefficient\n    `w_inter`: Cerebellar interposed synaptic weight\n    `graspThreshold`: Firing rate required to command active digit flexion (e.g. 80 Hz)\n    `maxPermittedTremor`: Maximum allowed terminal oscillation amplitude (e.g. 2 mm)\n-/\nstructure RubrospinalLoopState where\n  velocity : Nat\n  interposedDrive : Nat\n  baseRNm : Nat\n  k_vel : Nat\n  w_inter : Nat\n  graspThreshold : Nat\n  maxPermittedTremor : Nat\n  h_k_vel_pos : k_vel > 0\n  h_w_inter_pos : w_inter > 0\n  h_base_order : baseRNm < graspThreshold\n  deriving Repr\n\n/-- Compute Magnocellular Red Nucleus (RNm) firing rate. -/\ndef computeRNmRate (s : RubrospinalLoopState) : Nat :=\n  s.baseRNm + s.k_vel * s.velocity + s.w_inter * s.interposedDrive\n\n/-- Evaluate rubrospinal grasp state. -/\ndef evaluateGraspState (s : RubrospinalLoopState) : RubrospinalGraspState :=\n  if computeRNmRate s \u2265 s.graspThreshold then\n    RubrospinalGraspState.precisionGraspEngaged\n  else\n    RubrospinalGraspState.quiescent\n\n/-- Theorem: For any high-velocity reach or strong cerebellar drive meeting the threshold,\n    the rubrospinal loop unconditionally engages `precisionGraspEngaged`. -/\ntheorem velocity_drive_triggers_precision_grasp\n    (s : RubrospinalLoopState)\n    (h_drive : s.k_vel * s.velocity + s.w_inter * s.interposedDrive \u2265 s.graspThreshold) :\n    evaluateGraspState s = RubrospinalGraspState.precisionGraspEngaged := by", "figure_1_png": "docs/figures/figure_paper_175.png", "figure_1_svg": "docs/figures/figure_paper_175.svg", "figure_2_png": "docs/figures/figure_paper_175_validation.png", "figure_2_svg": "docs/figures/figure_paper_175_validation.svg"}, {"paper_number": 176, "target_number": 367, "title": "The Tectospinal Tract, Superior Colliculus Deep Layers, and Eye-Head Coordinated Gaze Shifts: Retinotopic Population Vectors and High-Throughput Triton Implementations", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #367: TectospinalGazeInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "The rapid reorientation of visual gaze toward unexpected environmental stimuli requires the tight spatial and temporal orchestration of ocular and cephalic motor systems. The superior colliculus (SC), particularly its intermediate and deep strata (DLSC), serves as the central sensorimotor hub for this orienting behavior. Superficial collicular laminae maintain a point-to-point logarithmic retinotopic map of visual space, while deep layers translate sensory topography into vectorial motor commands executed simultaneously through brainstem premotor burst neurons and the tectospinal tract. The tectospinal pathway decussates in the dorsal tegmental decussation (Meynert's decussation) and descends through the anterior funiculus of the cervical spinal cord, making monosynaptic and disynaptic excitatory connections with motoneurons innervating dorsal neck muscles (e.g., splenius capitis, rectus capitis posterior, obliquus capitis, and sternocleidomastoid via spinal accessory nucleus CN XI). Here, we formalize the computational architecture of collicular eye-head gaze decomposition, demonstrate the logarithmic motor map transformation, prove the monotonicity of collicular burst firing and threshold-dependent cephalic recruitment in Lean 4 (Target #367, 367/367 verified), benchmark an AVX2 SIMD implementation operating at $1.46\\times 10^7$ motor map units/s, and deploy a fused Triton 3.9 GPU kernel executing low-latency population vector synthesis for real-time robotic and neuromorphic gaze orienting.", "formal_proof": "namespace Weft.Formal\n\n/-- Gaze orienting execution mode:\n    - `saccadeEngaged`: Active burst orientation displacing visual line of sight.\n    - `fixationMaintained`: Omnipause neurons gating motor burst.\n-/\ninductive CollicularGazeMode where\n  | saccadeEngaged : CollicularGazeMode\n  | fixationMaintained : CollicularGazeMode\n  deriving Repr, DecidableEq\n\n/-- State parameters for superior colliculus motor burst and eye-head gaze shift:\n    `targetEccentricity`: Visual target eccentricity (degrees, scaled as Nat)\n    `headThreshold`: Head movement recruitment threshold (degrees, e.g. 15 deg)\n    `collicularGain`: Firing gain of collicular burst generation\n    `tectoGain`: Cervical tectospinal coupling gain\n    `opnInhibitionThreshold`: Omnipause neuron inhibition threshold\n    `eyeGain`: Saccadic eye velocity gain\n-/\nstructure CollicularGazeState where\n  targetEccentricity : Nat\n  headThreshold : Nat\n  collicularGain : Nat\n  tectoGain : Nat\n  opnInhibitionThreshold : Nat\n  eyeGain : Nat\n  h_coll_pos : collicularGain > 0\n  h_tecto_pos : tectoGain > 0\n  h_eye_pos : eyeGain > 0\n  deriving Repr\n\n/-- Compute DLSC population burst frequency (Hz). -/\ndef computeCollicularBurst (s : CollicularGazeState) : Nat :=\n  s.collicularGain * s.targetEccentricity\n\n/-- Compute eye saccade command velocity. -/\ndef computeEyeVelocity (s : CollicularGazeState) : Nat :=\n  s.eyeGain * s.targetEccentricity\n\n/-- Compute cervical head turn velocity command.\n    Head turn only engages if target eccentricity exceeds headThreshold. -/\ndef computeHeadVelocity (s : CollicularGazeState) : Nat :=\n  if s.targetEccentricity >= s.headThreshold then\n    s.tectoGain * (s.targetEccentricity - s.headThreshold)\n  else\n    0\n\n/-- Evaluate collicular gaze mode based on OPN threshold crossing. -/\ndef evaluateGazeMode (s : CollicularGazeState) : CollicularGazeMode :=\n  if computeCollicularBurst s >= s.opnInhibitionThreshold then\n    CollicularGazeMode.saccadeEngaged\n  else\n    CollicularGazeMode.fixationMaintained\n\n/-- Saccade initiation condition: collicular burst must overcome omnipause neuron inhibition. -/\ndef saccadeInitiationPermitted (s : CollicularGazeState) : Prop :=\n  computeCollicularBurst s >= s.opnInhibitionThreshold\n\n/-- Combined gaze shift velocity command: sum of eye and head contributions. -/\ndef computeTotalGazeVelocity (s : CollicularGazeState) : Nat :=\n  computeEyeVelocity s + computeHeadVelocity s\n\n/-- Theorem 1: Saccade burst monotonicity with respect to target eccentricity. -/\ntheorem saccade_burst_monotonic (s : CollicularGazeState) (e1 e2 : Nat)\n    (h_le : e1 <= e2) :\n    let s1 : CollicularGazeState := { s with targetEccentricity := e1 }\n    let s2 : CollicularGazeState := { s with targetEccentricity := e2 }\n    computeCollicularBurst s1 <= computeCollicularBurst s2 := by", "figure_1_png": "docs/figures/figure_paper_176.png", "figure_1_svg": "docs/figures/figure_paper_176.svg", "figure_2_png": "docs/figures/figure_paper_176_validation.png", "figure_2_svg": "docs/figures/figure_paper_176_validation.svg"}, {"paper_number": 177, "target_number": 368, "title": "The Lateral Corticospinal Tract, Primary Motor Cortex Betz Cells, and Distal Digit Force Fractionation: Monosynaptic Cortico-Motoneuronal Verification and Microarchitectural Optimization", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #368: CorticospinalFractionationInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "The evolutionary pinnacle of primate motor control is the capacity for independent finger movements (fractionation), enabling dextrous manual object manipulation, tool use, and fine precision grip. The structural substrate of this agility is the **lateral corticospinal tract (LCST)**, particularly the direct **monosynaptic cortico-motoneuronal (CM)** connections originating from giant pyramidal neurons (Betz cells) in Layer V of the primary motor cortex (M1, Brodmann Area 4). CM axons bypass spinal interneuronal networks to terminate directly on the somatic and proximal dendritic membranes of lower cervical ($C_7 - T_1$) alpha-motoneurons supplying intrinsic and extrinsic hand muscles (e.g., first dorsal interosseous, abductor pollicis brevis, flexor digitorum profundus). \n\nIn this paper, we establish a comprehensive, mathematically certified biophysical foundation of CM monosynaptic drive and digit individuation. We formalize the electrophysiological rate-coding laws and Henneman size-principle recruitment dynamics, prove the strict monotonicity of M1 rate coding and the invariant boundedness of adjacent digit enslavement ($\\kappa_{\\text{spill}} \\le 0.10 \\implies S_{\\text{frac}} \\ge 90\\%$) in Lean 4 without speculative axioms, benchmark an AVX2 SIMD vectorized kernel operating at $15.72\\times 10^9$ motor units/second, and deploy a fused Triton 3.9 GPU kernel executing real-time high-throughput neural prosthesis emulation.", "formal_proof": "namespace Weft.Formal.CorticospinalFractionation\n\nstructure CorticospinalState where\n  targetForce : Nat\n  m1BaseRate : Nat\n  m1Gain : Nat\n  spilloverGain : Nat\n  fractionationThreshold : Nat\n  h_gain_pos : m1Gain > 0\n  h_spill_bound : spilloverGain <= 10  -- spillover coefficient <= 10%\n\n/-- Theorem 1: M1 Betz cell firing rate is strictly monotonic with target digit force. -/\ntheorem m1_firing_rate_monotonic (s : CorticospinalState) (f1 f2 : Nat)\n    (h_le : f1 <= f2) :\n    let s1 : CorticospinalState := { s with targetForce := f1 }\n    let s2 : CorticospinalState := { s with targetForce := f2 }\n    computeM1FiringRate s1 <= computeM1FiringRate s2 := by\n  intro s1 s2\n  dsimp [computeM1FiringRate, s1, s2]\n  have h_mul : s.m1Gain * f1 <= s.m1Gain * f2 := Nat.mul_le_mul_left s.m1Gain h_le\n  exact Nat.add_le_add_left h_mul s.m1BaseRate\n\n/-- Theorem 3: Strict fractionation bound for low force regimes. -/\ntheorem fractionated_precision_guarantee (s : CorticospinalState)\n    (h_bound : s.targetForce * s.spilloverGain <= 100 * s.fractionationThreshold) :\n    isFractionated s := by\n  dsimp [isFractionated, computeSpilloverForce]\n  exact Nat.div_le_of_le_mul h_bound", "figure_1_png": "docs/figures/figure_paper_177.png", "figure_1_svg": "docs/figures/figure_paper_177.svg", "figure_2_png": "docs/figures/figure_paper_177_validation.png", "figure_2_svg": "docs/figures/figure_paper_177_validation.svg"}, {"paper_number": 178, "target_number": 369, "title": "Anterior Intraparietal Area (AIP) Visual Affordance, Ventral Premotor (F5) Motor Prototypes, and Jeannerod Hand Aperture Preshaping: Formal Verification and Fused Triton Microarchitecture", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #369: AIPF5GraspAffordanceInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Manual interaction with physical objects requires transforming three-dimensional visual features\u2014such as object size, orientation, and geometric curvature\u2014into an appropriate hand posture and dynamic motor preshaping trajectory. This visuomotor transformation is mediated by the cortical **dorsal stream parieto-frontal circuit**, linking the **anterior intraparietal area (AIP)** with the **ventral premotor cortex (PMv, Area F5)** and the primary motor cortex (M1). AIP contains \"canonical\" neurons that selectively discharge during the visual presentation of graspable objects even in the absence of an immediate motor response. Area F5 translates these parietal affordances into discrete motor prototypes (precision pinch vs. whole-hand power grasp) and commands the continuous opening and closing of the fingers during reach-to-grasp transport. A cardinal behavioral invariant of this system is **Jeannerod hand preshaping**, wherein maximum finger aperture scales linearly with object width and reliably occurs at approximately $65\\% - 75\\%$ of the reach deceleration phase. In this paper, we formalize the mathematical invariants of AIP affordance extraction and F5 aperture scaling in Lean 4 (Target #369, 369/369 verified), benchmark an AVX2 SIMD vectorized kernel executing at $1.933\\times 10^7$ visual affordance instances/s, and implement a fused Triton 3.9 GPU operator for real-time neuromorphic robotic manipulation.", "formal_proof": "namespace Weft.Formal\n\n/-- Grasp affordance prototype category:\n    - `precisionPinch`: Index-thumb pad-to-pad opposition for small objects.\n    - `powerGrip`: Palm and multi-finger flexion wrap for large objects.\n-/\ninductive GripPrototype where\n  | precisionPinch : GripPrototype\n  | powerGrip : GripPrototype\n  deriving Repr, DecidableEq\n\n/-- State representation of visual grasp affordance system:\n    `objectWidth`: Object diameter/width (mm, scaled as Nat)\n    `pinchThreshold`: Diameter cutoff dividing pinch from power grasp (e.g. 35 mm)\n    `apertureIntercept`: Hand aperture baseline safety margin (e.g. 18 mm)\n    `apertureSlope`: Linear scaling of aperture with object size (e.g. 1)\n    `maxAperture`: Maximum physical finger span (e.g. 125 mm)\n-/\nstructure GraspAffordanceState where\n  objectWidth : Nat\n  pinchThreshold : Nat\n  apertureIntercept : Nat\n  apertureSlope : Nat\n  maxAperture : Nat\n  h_slope_pos : apertureSlope > 0\n  h_intercept_pos : apertureIntercept > 0\n  h_max_bound : apertureIntercept + apertureSlope * pinchThreshold <= maxAperture\n  deriving Repr\n\n/-- Compute Jeannerod peak hand preshaping aperture: a + b * width, capped at maxAperture. -/\ndef computePeakAperture (s : GraspAffordanceState) : Nat :=\n  let raw := s.apertureIntercept + s.apertureSlope * s.objectWidth\n  if raw <= s.maxAperture then raw else s.maxAperture\n\n/-- Classify grip prototype based on visual object dimension. -/\ndef selectGripPrototype (s : GraspAffordanceState) : GripPrototype :=\n  if s.objectWidth < s.pinchThreshold then\n    GripPrototype.precisionPinch\n  else\n    GripPrototype.powerGrip\n\n/-- Safety invariant: Hand aperture must always exceed object width to guarantee collision-free enclosure. -/\ndef apertureSufficient (s : GraspAffordanceState) : Prop :=\n  computePeakAperture s >= s.objectWidth\n\n/-- Theorem 1: Raw hand preshaping aperture is strictly monotonic with respect to object width. -/\ntheorem raw_aperture_monotonic (s : GraspAffordanceState) (w1 w2 : Nat)\n    (h_le : w1 <= w2) :\n    s.apertureIntercept + s.apertureSlope * w1 <= s.apertureIntercept + s.apertureSlope * w2 := by", "figure_1_png": "docs/figures/figure_paper_178.png", "figure_1_svg": "docs/figures/figure_paper_178.svg", "figure_2_png": "docs/figures/figure_paper_178_validation.png", "figure_2_svg": "docs/figures/figure_paper_178_validation.svg"}, {"paper_number": 179, "target_number": 370, "title": "Spinal Presynaptic Primary Afferent Depolarization (PAD), Axo-Axonic GABAergic Inflow Gating, and Reflex Suppression During Voluntary Locomotion", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #370: SpinalPADInflowGatingInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Sensory feedback from peripheral mechanoreceptors (Group Ia muscle spindles, Group Ib Golgi tendon organs, and cutaneous tactile afferents) provides indispensable error signals for static posture, yet can critically disrupt the execution of high-velocity voluntary movements if transmitted unchecked through monosynaptic reflex loops. To prevent reflex oscillations, clonic tremor, and unwanted resistance against voluntary muscle shortening, the central nervous system exerts powerful **presynaptic inhibition** at intraspinal primary afferent terminal boutons before signals reach alpha-motoneurons. This presynaptic control is mediated by a dedicated class of spinal interneurons that form axo-axonic synapses onto primary afferent boutons, releasing gamma-aminobutyric acid (GABA) to generate **primary afferent depolarization (PAD)**. Because primary afferents accumulate intracellular chloride via the $\\text{Na}^+-\\text{K}^+-2\\text{Cl}^-$ cotransporter (NKCC1), activation of terminal $\\text{GABA}_A$ receptors causes $\\text{Cl}^-$ efflux and depolarization toward $E_{\\text{Cl}} \\approx -35\\text{ mV}$. This depolarization shunts incoming action potential amplitudes, inactivates terminal voltage-gated $\\text{Na}^+$ channels, and couples via $\\text{GABA}_B$ receptors to inhibit $\\text{Ca}_V2.2$ (N-type) and $\\text{Ca}_V2.1$ (P/Q-type) calcium influx, drastically suppressing quantal neurotransmitter exocytosis. In this paper, we formalize the physiological and biophysical principles of descending PAD recruitment and monosynaptic reflex attenuation, prove the monotonicity of sensory gating and quiescent reflex preservation in Lean 4 (Target #370, 370/370 verified), benchmark an AVX2 SIMD kernel operating at $1.346\\times 10^7$ terminal boutons/s, and implement a fused Triton 3.9 GPU operator for real-time robotic and neuromorphic impedance control.", "formal_proof": "namespace Weft.Formal\n\n/-- Spinal reflex transmission regime:\n    - `sensoryGated`: Strong presynaptic PAD suppressing sensory reflex transmission.\n    - `intactReflex`: Minimal PAD permitting high-gain postural stabilization.\n-/\ninductive SpinalGatingRegime where\n  | sensoryGated : SpinalGatingRegime\n  | intactReflex : SpinalGatingRegime\n  deriving Repr, DecidableEq\n\n/-- State representation of a spinal presynaptic gating circuit:\n    `descendingDrive`: Voluntary descending command / velocity (scaled as Nat, e.g. cm/s)\n    `padBaseRate`: Spontaneous baseline discharge of GABAergic PAD interneurons (Hz)\n    `padGain`: PAD interneuron sensitivity gain\n    `padThreshold`: Firing rate required to induce significant reflex suppression (Hz)\n    `maxPermittedEPSP`: Upper bound on monosynaptic EPSP in gated state (mV, scaled as Nat)\n-/\nstructure SpinalPADState where\n  descendingDrive : Nat\n  padBaseRate : Nat\n  padGain : Nat\n  padThreshold : Nat\n  maxPermittedEPSP : Nat\n  h_gain_pos : padGain > 0\n  h_base_lt_thresh : padBaseRate < padThreshold\n  deriving Repr\n\n/-- Compute GABAergic PAD interneuron firing rate. -/\ndef computePADRate (s : SpinalPADState) : Nat :=\n  s.padBaseRate + s.padGain * s.descendingDrive\n\n/-- Evaluate whether sensory transmission is gated or intact. -/\ndef evaluateGatingRegime (s : SpinalPADState) : SpinalGatingRegime :=\n  if computePADRate s >= s.padThreshold then\n    SpinalGatingRegime.sensoryGated\n  else\n    SpinalGatingRegime.intactReflex\n\n/-- Presynaptic attenuation predicate: Sensory inflow is gated if PAD exceeds threshold. -/\ndef isSensoryGated (s : SpinalPADState) : Prop :=\n  computePADRate s >= s.padThreshold\n\n/-- Theorem 1: PAD interneuron firing rate is strictly monotonic with descending motor drive. -/\ntheorem pad_firing_rate_monotonic (s : SpinalPADState) (v1 v2 : Nat)\n    (h_le : v1 <= v2) :\n    let s1 : SpinalPADState := { s with descendingDrive := v1 }\n    let s2 : SpinalPADState := { s with descendingDrive := v2 }\n    computePADRate s1 <= computePADRate s2 := by", "figure_1_png": "docs/figures/figure_paper_179.png", "figure_1_svg": "docs/figures/figure_paper_179.svg", "figure_2_png": "docs/figures/figure_paper_179_validation.png", "figure_2_svg": "docs/figures/figure_paper_179_validation.svg"}, {"paper_number": 180, "target_number": 371, "title": "The Supplementary Motor Area, Pre-SMA Hierarchical Chunking, and Temporal Phasing of Complex Motor Sequences: Formal Verification and Fused Triton Operators", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #371: SMAPreSMACallosalInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "The synthesis of complex goal-directed behaviors requires assembling elementary motor primitives into fluid, sequentially ordered \"action chunks\". In the primate neocortex, this temporal orchestration is governed by the medial premotor cortex (Brodmann Area 6), comprising the **supplementary motor area (SMA proper)** and the **pre-supplementary motor area (pre-SMA)**. While the primary motor cortex (M1) commands instantaneous muscular contractions and single-digit kinematics, SMA proper and pre-SMA operate at a higher level of temporal abstraction. Neurons in pre-SMA discharge preferentially at the boundaries between action chunks, mediating the context-dependent retrieval and reorganization of upcoming motor sequences. Conversely, neurons in SMA proper encode temporal intervals and specific sequential ranks (e.g., selective firing exclusively during the second movement of a three-step sequence: *Turn $\\to$ Pull $\\to$ Push*), exhibiting ramp-to-threshold climbing activity that serves as an internal biological clock for movement initiation. Furthermore, dense transcallosal connections within SMA proper mediate the precise bilateral phase-coupling necessary for bimanual manipulation. In this paper, we formalize the hierarchical chunking and temporal phasing invariants of the pre-SMA/SMA circuit in Lean 4 (Target #371, 371/371 verified), benchmark an AVX2 SIMD microkernel executing at $2.169\\times 10^7$ action chunk units/s, and deploy a fused Triton 3.9 GPU operator for real-time robotic multi-step motor planning.", "formal_proof": "namespace Weft.Formal\n\n/-- Execution phase within a motor sequence chunk:\n    - `intervalTimingRamp`: Internal clock ramping toward transition threshold.\n    - `chunkTransitionTrigger`: Pre-SMA triggered reorganization to next motor primitive.\n-/\ninductive SequenceExecutionPhase where\n  | intervalTimingRamp : SequenceExecutionPhase\n  | chunkTransitionTrigger : SequenceExecutionPhase\n  deriving Repr, DecidableEq\n\n/-- State representation of an SMA motor sequencing circuit:\n    `stepIndex`: Current active step within sequence (0 .. totalSteps - 1)\n    `totalSteps`: Total number of sub-movements in the chunk\n    `elapsedMs`: Milliseconds elapsed in current step\n    `targetDurationMs`: Target duration allocated for this sub-movement\n    `baseSMARate`: Spontaneous baseline firing of SMA timing neurons (Hz)\n    `rampGain`: Rate of frequency increase per elapsed millisecond\n    `transitionThreshold`: Firing rate required to signal chunk completion (Hz)\n-/\nstructure SMASequenceState where\n  stepIndex : Nat\n  totalSteps : Nat\n  elapsedMs : Nat\n  targetDurationMs : Nat\n  baseSMARate : Nat\n  rampGain : Nat\n  transitionThreshold : Nat\n  h_total_pos : totalSteps > 0\n  h_dur_pos : targetDurationMs > 0\n  h_gain_pos : rampGain > 0\n  h_base_lt_thresh : baseSMARate < transitionThreshold\n  deriving Repr\n\n/-- Compute SMA proper ramp-to-threshold firing rate. -/\ndef computeSMARate (s : SMASequenceState) : Nat :=\n  s.baseSMARate + s.rampGain * s.elapsedMs\n\n/-- Evaluate sequence phase based on threshold crossing. -/\ndef evaluateSequencePhase (s : SMASequenceState) : SequenceExecutionPhase :=\n  if computeSMARate s >= s.transitionThreshold then\n    SequenceExecutionPhase.chunkTransitionTrigger\n  else\n    SequenceExecutionPhase.intervalTimingRamp\n\n/-- Transition predicate: Is the current step ready to advance? -/\ndef isStepComplete (s : SMASequenceState) : Prop :=\n  computeSMARate s >= s.transitionThreshold\n\n/-- Advance sequence to next step (saturating at totalSteps - 1). -/\ndef advanceSequenceStep (s : SMASequenceState) : SMASequenceState :=\n  let nextStep := if s.stepIndex + 1 < s.totalSteps then s.stepIndex + 1 else s.stepIndex\n  { s with stepIndex := nextStep, elapsedMs := 0 }\n\n/-- Theorem 1: SMA timing rate is strictly monotonic with elapsed step time. -/\ntheorem sma_timing_rate_monotonic (s : SMASequenceState) (t1 t2 : Nat)\n    (h_le : t1 <= t2) :\n    let s1 : SMASequenceState := { s with elapsedMs := t1 }\n    let s2 : SMASequenceState := { s with elapsedMs := t2 }\n    computeSMARate s1 <= computeSMARate s2 := by", "figure_1_png": "docs/figures/figure_paper_180.png", "figure_1_svg": "docs/figures/figure_paper_180.svg", "figure_2_png": "docs/figures/figure_paper_180_validation.png", "figure_2_svg": "docs/figures/figure_paper_180_validation.svg"}, {"paper_number": 181, "target_number": 372, "title": "Primary Somatosensory Cutaneous Afferents, Fast-Adapting Mechanoreceptor Slip Transduction, and Reflex Grip Force Escalation", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #372: CutaneousSlipAfferentInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "Precision manual prehension requires maintaining a delicate mechanical balance between the normal grip force applied perpendicular to an object's surface and the tangential load force generated by gravity and limb acceleration. If normal force is insufficient, the object slips; if excessive, energy is wasted and fragile objects are crushed. To resolve this trade-off, primates rely on low-threshold mechanoreceptors embedded in the glabrous skin of the fingertips, particularly **fast-adapting type I (FA-I / Meissner corpuscles)** and **fast-adapting type II (FA-II / Pacinian corpuscles)**. When tangential shear breaches the Coulomb static friction boundary, microscopic relative motion across dermal papillary ridges generates high-frequency mechanical transients ($30 - 300\\text{ Hz}$). These vibrations provoke synchronized, high-frequency spike bursts in FA-I and FA-II afferents that ascend via the dorsal column-medial lemniscal pathway through the ventroposterolateral (VPL) thalamus to primary somatosensory cortex (S1, Areas 3b, 1, and 2). Within $\\sim 65 - 80\\text{ ms}$, this sensory signal triggers a rapid transcortical/spinal reflex that escalates normal grip force, quickly arresting the slip and restoring the canonical **Johansson & Westling safety margin** ($\\ge 1.25\\times$). In this paper, we formalize the mathematical invariants of cutaneous slip detection and reflex grip force escalation in Lean 4 (Target #372, 372/372 verified), benchmark an AVX2 SIMD microkernel operating at $2.001\\times 10^7$ mechanoreceptive afferents/s, and deploy a fused Triton 3.9 GPU kernel executing real-time friction-adaptive tactile feedback for dextrous robotic manipulation.", "formal_proof": "namespace Weft.Formal\n\n/-- Grasp frictional stability state:\n    - `stableHold`: Normal grip force satisfies safety margin against tangential load.\n    - `activeSlip`: Tangential load breaches static friction cone, requiring reflex escalation.\n-/\ninductive GripFrictionState where\n  | stableHold : GripFrictionState\n  | activeSlip : GripFrictionState\n  deriving Repr, DecidableEq\n\n/-- State representation of a cutaneous slip detection and grip compensation loop:\n    `normalGripForce`: Applied normal force perpendicular to object surface (N, scaled as Nat)\n    `tangentialLoad`: Downward gravitational load / inertial pull (N, scaled as Nat)\n    `frictionCoeffScaled`: Static friction coefficient mu * 100 (e.g. 35 for mu = 0.35)\n    `safetyMultiplier`: Desired safety factor * 100 (e.g. 130 for 1.3x margin)\n    `fa1BaseRate`: Spontaneous baseline discharge of Meissner afferents (Hz)\n    `fa1SlipGain`: Firing rate amplification under mechanical slip\n-/\nstructure TactileSlipState where\n  normalGripForce : Nat\n  tangentialLoad : Nat\n  frictionCoeffScaled : Nat\n  safetyMultiplier : Nat\n  fa1BaseRate : Nat\n  fa1SlipGain : Nat\n  h_mu_pos : frictionCoeffScaled > 0\n  h_safety_pos : safetyMultiplier >= 100\n  h_gain_pos : fa1SlipGain > 0\n  deriving Repr\n\n/-- Maximum available frictional resistance before slip: (normalGripForce * frictionCoeffScaled) / 100. -/\ndef computeMaxFriction (s : TactileSlipState) : Nat :=\n  (s.normalGripForce * s.frictionCoeffScaled) / 100\n\n/-- Evaluate grip frictional state based on Coulomb friction law. -/\ndef evaluateGripState (s : TactileSlipState) : GripFrictionState :=\n  if s.tangentialLoad > computeMaxFriction s then\n    GripFrictionState.activeSlip\n  else\n    GripFrictionState.stableHold\n\n/-- Compute required adapted normal grip force to restore target safety margin:\n    F_desired = (tangentialLoad * safetyMultiplier) / frictionCoeffScaled. -/\ndef computeAdaptedGripForce (s : TactileSlipState) : Nat :=\n  let desired := (s.tangentialLoad * s.safetyMultiplier) / s.frictionCoeffScaled\n  if desired > s.normalGripForce then desired else s.normalGripForce\n\n/-- Invariant: Is the current grip state physically slipping? -/\ndef isSlipping (s : TactileSlipState) : Prop :=\n  s.tangentialLoad > computeMaxFriction s\n\n/-- Theorem 1: Frictional limit is strictly monotonic with normal grip force. -/\ntheorem max_friction_monotonic (s : TactileSlipState) (f1 f2 : Nat)\n    (h_le : f1 <= f2) :\n    let s1 : TactileSlipState := { s with normalGripForce := f1 }\n    let s2 : TactileSlipState := { s with normalGripForce := f2 }\n    computeMaxFriction s1 <= computeMaxFriction s2 := by", "figure_1_png": "docs/figures/figure_paper_181.png", "figure_1_svg": "docs/figures/figure_paper_181.svg", "figure_2_png": "docs/figures/figure_paper_181_validation.png", "figure_2_svg": "docs/figures/figure_paper_181_validation.svg"}, {"paper_number": 182, "target_number": 373, "title": "Dentato-Thalamo-Cortical Projections, Ventrolateral Thalamic Gating, and Sub-Millisecond Phase Alignment of Voluntary Motor Commands", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #373: DentatoThalamicPhaseAlignmentInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "The precise execution of voluntary movement requires continuous calibration of primary motor cortex (M1) pyramidal tract outputs by predictive forward internal models computed in the lateral cerebellar hemispheres. The structural bridge mediating this cerebellar guidance is the **dentato-thalamo-cortical (DTC) pathway**. Large projection neurons located in the lateral cerebellar dentate nucleus issue thick, heavily myelinated axons that traverse the superior cerebellar peduncle (brachium conjunctivum), decussate across the midbrain tegmentum, and terminate with massive, multi-vesicular \"driver\" synaptic boutons in the motor thalamus\u2014specifically the **ventral lateral nucleus (VL, pars oralis / VLo and pars caudalis / VLc)**. VL thalamocortical relay cells project directly to Layer III and Layer V of M1 and dorsal premotor cortex (PMd), generating fast, sub-millisecond excitatory postsynaptic potentials (EPSPs) that phase-align cortical beta ($15 - 30\\text{ Hz}$) and gamma ($30 - 80\\text{ Hz}$) oscillations prior to movement onset. When the DTC pathway is severed or pharmacologically inactivated, movement initiation is delayed, fractionated digit coordination collapses into dysmetria, and terminal target deceleration degenerates into severe intention tremor. In this paper, we formalize the physiological and mathematical invariants of dentato-thalamic transmission and cortical phase-locking in Lean 4 (Target #373, 373/373 verified), benchmark an AVX2 SIMD microkernel executing at $3.526\\times 10^6$ units/s, and deploy a fused Triton 3.9 GPU operator for real-time predictive motor synchronization in neuromorphic robotics.", "formal_proof": "namespace Weft.Formal\n\n/-- Synchronization state of the DTC loop:\n    - `phaseLocked`: Dentate drive arrives in phase with cortical excitable state.\n    - `phaseSlip`: Phase misalignment exceeding tolerance.\n-/\ninductive DTCSyncMode where\n  | phaseLocked : DTCSyncMode\n  | phaseSlip : DTCSyncMode\n  deriving Repr, DecidableEq\n\n/-- State representation of a dentato-thalamo-cortical synchronization circuit:\n    `dentateRate`: Firing rate of lateral cerebellar dentate projection neurons (Hz)\n    `thalamicGain`: Firing rate to VL thalamic EPSP scaling gain\n    `syncThreshold`: Minimum firing rate required for robust phase-locking (Hz)\n    `phaseAlignmentDeg`: Phase alignment error in degrees (0 to 180)\n    `maxPermittedPhaseDeg`: Maximum allowed phase error for locking (e.g. 30 deg)\n-/\nstructure DentatoThalamicState where\n  dentateRate : Nat\n  thalamicGain : Nat\n  syncThreshold : Nat\n  phaseAlignmentDeg : Nat\n  maxPermittedPhaseDeg : Nat\n  h_gain_pos : thalamicGain > 0\n  h_thresh_pos : syncThreshold > 0\n  deriving Repr\n\n/-- Compute VL thalamic relay EPSP amplitude (scaled as Nat). -/\ndef computeThalamicEPSP (s : DentatoThalamicState) : Nat :=\n  s.thalamicGain * s.dentateRate\n\n/-- Evaluate DTC synchronization state. -/\ndef evaluateSyncMode (s : DentatoThalamicState) : DTCSyncMode :=\n  if s.dentateRate >= s.syncThreshold && s.phaseAlignmentDeg <= s.maxPermittedPhaseDeg then\n    DTCSyncMode.phaseLocked\n  else\n    DTCSyncMode.phaseSlip\n\n/-- Synchronization predicate: Is the loop phase-locked? -/\ndef isPhaseLocked (s : DentatoThalamicState) : Prop :=\n  s.dentateRate >= s.syncThreshold \u2227 s.phaseAlignmentDeg <= s.maxPermittedPhaseDeg\n\n/-- Theorem 1: Thalamic EPSP is strictly monotonic with dentate firing rate. -/\ntheorem thalamic_epsp_monotonic (s : DentatoThalamicState) (r1 r2 : Nat)\n    (h_le : r1 <= r2) :\n    let s1 : DentatoThalamicState := { s with dentateRate := r1 }\n    let s2 : DentatoThalamicState := { s with dentateRate := r2 }\n    computeThalamicEPSP s1 <= computeThalamicEPSP s2 := by", "figure_1_png": "docs/figures/figure_paper_182.png", "figure_1_svg": "docs/figures/figure_paper_182.svg", "figure_2_png": "docs/figures/figure_paper_182_validation.png", "figure_2_svg": "docs/figures/figure_paper_182_validation.svg"}, {"paper_number": 183, "target_number": 374, "title": "The Cortico-Subthalamic Hyperdirect Pathway, Global Basal Ganglia Motor Braking, and Stop-Signal Reaction Dynamics", "authors": "Nicholas Charles Mynhardt & Kevin W. McCairn, Ph.D.", "affiliation": "Stratum Research Group & Synaptek Labs", "verification_level": "100% Machine-Checked under Lean 4 (Target #374: CorticoSubthalamicBrakingInvariants, 0 Axioms, 0 Sorries)", "hardware_target": "AMD Ryzen 5 7600X (AVX2/FMA) & NVIDIA RTX 5060 Ti (Fused Triton 3.9)", "abstract": "The capability to abruptly cancel an initiated motor command in response to sudden environmental hazards is an essential survival mechanism in animal and human behavior. While the classical direct and indirect pathways of the basal ganglia filter and select motor repertoires over long loop latencies ($>120\\text{ ms}$), rapid behavioral inhibition requires an ultra-fast bypass mechanism: the **cortico-subthalamic hyperdirect pathway**. Originating primarily from the right inferior frontal cortex (rIFC) and pre-supplementary motor area (pre-SMA), hyperdirect fibers project directly and monosynaptically to the subthalamic nucleus (STN), completely bypassing the striatum. STN neurons emit divergent glutamatergic projections to the internal segment of the globus pallidus (GPi) and substantia nigra pars reticulata (SNr), which in turn release massive GABAergic inhibition across motor thalamic nuclei (VA/VL), slamming a global \"emergency brake\" on corticospinal outflow. In psychological terms, this circuit instantiates the winning \"Stop\" process in the classical Logan and Cowan race model, achieving stop-signal reaction times (SSRT) under $20\\text{ ms}$ post-STN activation. In this paper, we formalize the mathematical invariants of hyperdirect motor braking and cancellation thresholds in Lean 4 (Target #374, 374/374 verified), benchmark an AVX2 SIMD vectorized kernel operating at $1.709\\times 10^7$ gating units/s, and deploy a fused Triton 3.9 GPU operator for real-time safety shut-off in autonomous robotics and brain-machine interfaces.", "formal_proof": "namespace Weft.Formal\n\n/-- Action execution status in stop-signal paradigm:\n    - `actionExecuted`: Go process wins; thalamocortical transmission proceeds.\n    - `actionAborted`: Hyperdirect stop process wins; global thalamic brake clamped.\n-/\ninductive StopSignalActionState where\n  | actionExecuted : StopSignalActionState\n  | actionAbo

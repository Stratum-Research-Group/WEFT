    function initCableCanvas() {
      const canvas = document.getElementById('cableCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const N = 60;
      let V = new Float32Array(N);
      let lambda = 1.5;
      let tau = 20.0;

      const sL = document.getElementById('lambdaSlider');
      const sT = document.getElementById('tauSlider');
      const btn = document.getElementById('pulseInjectBtn');

      if (sL) sL.oninput = (e) => { lambda = parseFloat(e.target.value) / 10.0; document.getElementById('lambdaVal').textContent = lambda.toFixed(1) + ' mm'; };
      if (sT) sT.oninput = (e) => { tau = parseFloat(e.target.value); document.getElementById('tauVal').textContent = tau.toFixed(0) + ' ms'; };
      if (btn) btn.onclick = () => { V[5] += 40.0; };

      function stepCable() {
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Discretized 1D Cable diffusion
        const dt = 0.4;
        const D = (lambda * lambda) * 0.15;
        const newV = new Float32Array(N);

        for (let i = 1; i < N - 1; i++) {
          const diff = (V[i + 1] - 2 * V[i] + V[i - 1]);
          const decay = -V[i] / tau;
          newV[i] = V[i] + (D * diff + decay) * dt;
        }
        newV[0] = newV[1];
        newV[N - 1] = newV[N - 2];
        V = newV;

        // Render Cable Potential profile
        const dx = canvas.width / N;
        const baselineY = canvas.height - 30;

        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, baselineY); ctx.lineTo(canvas.width, baselineY);
        ctx.stroke();

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < N; i++) {
          const px = i * dx;
          const py = baselineY - V[i] * 3.0;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Electrotonic distance gradient
        for (let i = 0; i < N; i += 5) {
          ctx.fillStyle = '#64748b';
          ctx.font = '9px monospace';
          ctx.fillText((i * 0.1).toFixed(1) + 'λ', i * dx - 8, baselineY + 16);
        }
      }
      setInterval(stepCable, 30);
    }

    
    
    function initHindmarshRoseCanvas() {
      const canvas = document.getElementById('hrCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let I = 3.2;
      let r = 0.006;
      let s = 4.0;
      let x_R = -1.6;

      const sI = document.getElementById('hrISlider');
      const sR = document.getElementById('hrRSlider');
      const sXr = document.getElementById('hrXrSlider');
      if (sI) sI.oninput = (e) => { I = parseFloat(e.target.value) / 10.0; document.getElementById('hrIVal').textContent = I.toFixed(1); };
      if (sR) sR.oninput = (e) => { r = parseFloat(e.target.value) / 1000.0; document.getElementById('hrRVal').textContent = r.toFixed(3); };
      if (sXr) sXr.oninput = (e) => { x_R = -parseFloat(e.target.value) / 10.0; document.getElementById('hrXrVal').textContent = x_R.toFixed(1); };

      let x = -1.3, y = -10.0, z = 1.0;
      const history = [];
      let rotAngle = 0.0;

      function renderFrame() {
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const a = 1.0, b = 3.0, c = 1.0, d = 5.0;

        // RK2 / Euler step
        const dt = 0.025;
        for (let step = 0; step < 8; step++) {
          const dx = y - a * x * x * x + b * x * x - z + I;
          const dy = c - d * x * x - y;
          const dz = r * (s * (x - x_R) - z);
          x += dx * dt;
          y += dy * dt;
          z += dz * dt;
        }

        history.push({ x, y, z });
        if (history.length > 350) history.shift();

        // 3D Isometric projection with slow continuous rotation
        const cosA = Math.cos(rotAngle);
        const sinA = Math.sin(rotAngle);

        if (history.length > 1) {
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          for (let i = 0; i < history.length; i++) {
            const pt = history[i];
            // Rotate around z-axis
            const rx = pt.x * cosA - (pt.y * 0.1) * sinA;
            const ry = pt.x * sinA + (pt.y * 0.1) * cosA;
            // Isometric projection
            const px = cx + (rx - ry * 0.5) * 65.0;
            const py = cy + (ry * 0.5 - pt.z * 0.4) * 55.0;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();

          // Draw head
          const head = history[history.length - 1];
          const rx = head.x * cosA - (head.y * 0.1) * sinA;
          const ry = head.x * sinA + (head.y * 0.1) * cosA;
          const hpx = cx + (rx - ry * 0.5) * 65.0;
          const hpy = cy + (ry * 0.5 - head.z * 0.4) * 55.0;
          ctx.fillStyle = '#f43f5e';
          ctx.beginPath();
          ctx.arc(hpx, hpy, 4, 0, 2 * Math.PI);
          ctx.fill();
        }
        rotAngle += 0.008;
      }
      setInterval(renderFrame, 35);
    }

    function initWilsonCowanCanvas() {
      const canvas = document.getElementById('wcCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w_ee = 16.0;
      let w_ie = 12.0;
      let ext_P = 1.2;
      const w_ei = 15.0;
      const w_ii = 3.0;
      const ext_Q = 0.0;

      const sWee = document.getElementById('weeSlider');
      const sWie = document.getElementById('wieSlider');
      const sExtP = document.getElementById('extPSlider');
      if (sWee) sWee.oninput = (e) => { w_ee = parseFloat(e.target.value); document.getElementById('weeVal').textContent = w_ee; };
      if (sWie) sWie.oninput = (e) => { w_ie = parseFloat(e.target.value); document.getElementById('wieVal').textContent = w_ie; };
      if (sExtP) sExtP.oninput = (e) => { ext_P = parseFloat(e.target.value) / 10.0; document.getElementById('extPVal').textContent = ext_P.toFixed(1); };

      let E = 0.2;
      let I = 0.15;
      const history = [];

      function sigmoid(x) {
        return 1.0 / (1.0 + Math.exp(-x));
      }

      function renderFrame() {
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const pad = 40;
        const w = canvas.width - 2 * pad;
        const h = canvas.height - 2 * pad;

        // Axes
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(pad, pad); ctx.lineTo(pad, pad + h); ctx.lineTo(pad + w, pad + h);
        ctx.stroke();

        ctx.fillStyle = '#64748b';
        ctx.font = '10px monospace';
        ctx.fillText('E (Excitatory)', pad + w - 80, pad + h + 24);
        ctx.fillText('I (Inhibitory)', pad - 35, pad + 15);

        // Numerical integration (Euler)
        const dt = 0.08;
        const tau_e = 1.0;
        const tau_i = 1.5;

        for (let s = 0; s < 5; s++) {
          const dE = (-E + sigmoid(w_ee * E - w_ie * I + ext_P - 4.0)) / tau_e;
          const dI = (-I + sigmoid(w_ei * E - w_ii * I + ext_Q - 3.7)) / tau_i;
          E = Math.max(0.0, Math.min(1.0, E + dE * dt));
          I = Math.max(0.0, Math.min(1.0, I + dI * dt));
        }

        history.push({ e: E, i: I });
        if (history.length > 250) history.shift();

        // Draw Limit-Cycle Trajectory
        if (history.length > 1) {
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let idx = 0; idx < history.length; idx++) {
            const px = pad + history[idx].e * w;
            const py = (pad + h) - history[idx].i * h;
            if (idx === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();

          const head = history[history.length - 1];
          ctx.fillStyle = '#f43f5e';
          ctx.beginPath();
          ctx.arc(pad + head.e * w, (pad + h) - head.i * h, 4, 0, 2 * Math.PI);
          ctx.fill();
        }
      }
      setInterval(renderFrame, 35);
    }

    function initCdfCanvas() {
      const canvas = document.getElementById('cdfCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      function drawCdf() {
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const padLeft = 50;
        const padRight = 30;
        const padTop = 20;
        const padBottom = 30;
        const w = canvas.width - padLeft - padRight;
        const h = canvas.height - padTop - padBottom;

        // Axes
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padLeft, padTop); ctx.lineTo(padLeft, padTop + h); ctx.lineTo(padLeft + w, padTop + h);
        ctx.stroke();

        ctx.fillStyle = '#64748b';
        ctx.font = '10px monospace';
        ctx.fillText('0.0', padLeft - 24, padTop + h);
        ctx.fillText('0.5', padLeft - 24, padTop + h / 2);
        ctx.fillText('1.0', padLeft - 24, padTop + 8);
        ctx.fillText('0ms', padLeft - 5, padTop + h + 16);
        ctx.fillText('4ms', padLeft + w / 2 - 10, padTop + h + 16);
        ctx.fillText('8ms', padLeft + w - 15, padTop + h + 16);

        // Draw CDF curves
        const curves = [
          { color: '#38bdf8', mu: 1.2, sig: 0.3 }, // Triton
          { color: '#34d399', mu: 2.1, sig: 0.5 }, // AVX-512
          { color: '#fbbf24', mu: 4.5, sig: 0.9 }, // NEON
        ];

        for (const c of curves) {
          ctx.strokeStyle = c.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let px = 0; px <= w; px += 2) {
            const ms = (px / w) * 8.0;
            // Normal CDF approximation
            const z = (ms - c.mu) / (c.sig * Math.SQRT2);
            const prob = 0.5 * (1 + Math.tanh(z * 1.2));
            const py = (padTop + h) - prob * h;
            if (px === 0) ctx.moveTo(padLeft + px, py);
            else ctx.lineTo(padLeft + px, py);
          }
          ctx.stroke();
        }
      }
      drawCdf();
    }

    function initNullclineCanvas(targetNum) {
      const canvas = document.getElementById('nullclineCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let I_inj = 0.25;
      let a = 0.07;
      let b = 0.20;

      const sInj = document.getElementById('injSlider');
      const sA = document.getElementById('aParamSlider');
      const sB = document.getElementById('bParamSlider');
      if (sInj) sInj.oninput = (e) => { I_inj = parseFloat(e.target.value) / 100.0; document.getElementById('injVal').textContent = I_inj.toFixed(2); };
      if (sA) sA.oninput = (e) => { a = parseFloat(e.target.value) / 100.0; document.getElementById('aVal').textContent = a.toFixed(2); };
      if (sB) sB.oninput = (e) => { b = parseFloat(e.target.value) / 100.0; document.getElementById('bVal').textContent = b.toFixed(2); };

      let traj_v = -1.0;
      let traj_w = -0.5;
      const history = [];

      function renderFrame() {
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const scaleX = 110;
        const scaleY = 90;

        // Draw coordinate axes
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy);
        ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height);
        ctx.stroke();

        // Draw Cubic v-Nullcline: w = v - v^3 / 3 + I_inj
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let px = 0; px < canvas.width; px += 2) {
          const v = (px - cx) / scaleX;
          const w = v - (v * v * v) / 3.0 + I_inj;
          const py = cy - w * scaleY;
          if (px === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Draw Linear w-Nullcline: w = (v + a) / b
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let px = 0; px < canvas.width; px += 4) {
          const v = (px - cx) / scaleX;
          const w = (v + a) / Math.max(0.01, b);
          const py = cy - w * scaleY;
          if (px === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Numerical integration step (RK2 / Euler)
        const dt = 0.05;
        for (let step = 0; step < 4; step++) {
          const dv = traj_v - (traj_v * traj_v * traj_v) / 3.0 - traj_w + I_inj;
          const dw = 0.08 * (traj_v + 0.7 - 0.8 * traj_w);
          traj_v += dv * dt;
          traj_w += dw * dt;
        }

        history.push({ v: traj_v, w: traj_w });
        if (history.length > 250) history.shift();

        // Draw Trajectory
        if (history.length > 1) {
          ctx.strokeStyle = '#34d399';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let i = 0; i < history.length; i++) {
            const hx = cx + history[i].v * scaleX;
            const hy = cy - history[i].w * scaleY;
            if (i === 0) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
          }
          ctx.stroke();

          // Current state head
          const head = history[history.length - 1];
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.arc(cx + head.v * scaleX, cy - head.w * scaleY, 4, 0, 2 * Math.PI);
          ctx.fill();
        }
      }
      setInterval(renderFrame, 35);
    }

    function initCannCanvas(targetNum) {
      const canvas = document.getElementById('cannCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let wInh = 45;
      let vel = 20;
      let shear = 30;
      let t_offset = 0;

      const sW = document.getElementById('wInhSlider');
      const sV = document.getElementById('velSlider');
      const sS = document.getElementById('shearSlider');
      if (sW) sW.oninput = (e) => { wInh = parseFloat(e.target.value); document.getElementById('wInhVal').textContent = wInh; };
      if (sV) sV.oninput = (e) => { vel = parseFloat(e.target.value); document.getElementById('velVal').textContent = vel; };
      if (sS) sS.oninput = (e) => { shear = parseFloat(e.target.value); document.getElementById('shearVal').textContent = shear + '°'; };

      function renderFrame() {
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cols = 40;
        const rows = 14;
        const dx = canvas.width / cols;
        const dy = canvas.height / rows;
        const shearRad = (shear * Math.PI) / 180;
        const vScale = vel * 0.05;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = (c + (r % 2) * 0.5) * dx;
            const y = r * dy;
            // 3-wave interference creating hexagonal lattice
            const k1 = (x * Math.cos(0) + y * Math.sin(0)) * 0.08 + t_offset;
            const k2 = (x * Math.cos(Math.PI / 3 + shearRad * 0.2) + y * Math.sin(Math.PI / 3 + shearRad * 0.2)) * 0.08 + t_offset * 0.8;
            const k3 = (x * Math.cos(2 * Math.PI / 3) + y * Math.sin(2 * Math.PI / 3)) * 0.08 - t_offset * 0.5;

            const wave = Math.cos(k1) + Math.cos(k2) + Math.cos(k3);
            const act = Math.max(0, (wave - (wInh / 40 - 0.5)) / 2.5);

            if (act > 0.05) {
              const radius = Math.min(dx * 0.45, Math.max(2, act * 7));
              const intensity = Math.min(255, Math.floor(act * 255));
              ctx.fillStyle = `rgb(${intensity}, ${Math.floor(intensity * 0.7)}, ${255 - Math.floor(intensity * 0.3)})`;
              ctx.beginPath();
              ctx.arc(x + dx / 2, y + dy / 2, radius, 0, 2 * Math.PI);
              ctx.fill();
            }
          }
        }
        t_offset += vScale * 0.04;
      }
      setInterval(renderFrame, 40);
    }

    function initPhaseSpaceCanvas(targetNum) {
      const canvas = document.getElementById('phaseCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let angle = 0;
      let gNa = 120, gK = 36, gCa = 8;

      const sNa = document.getElementById('gNaSlider');
      const sK = document.getElementById('gKSlider');
      const sCa = document.getElementById('gCaSlider');
      if (sNa) sNa.oninput = (e) => { gNa = parseFloat(e.target.value); document.getElementById('gNaVal').textContent = gNa; };
      if (sK) sK.oninput = (e) => { gK = parseFloat(e.target.value); document.getElementById('gKVal').textContent = gK; };
      if (sCa) sCa.oninput = (e) => { gCa = parseFloat(e.target.value); document.getElementById('gCaVal').textContent = gCa; };

      function renderFrame() {
        ctx.fillStyle = '#050811';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const r_base = 50 + (gNa / 120) * 20;
        const modulation = (gCa / 8) * 25;
        const harm = (gK / 36) * 3;
        
        for (let t = 0; t < 600; t++) {
          const theta = t * 0.05;
          const r = r_base + modulation * Math.sin(theta * harm + targetNum * 0.1);
          const x = cx + r * Math.cos(theta + angle);
          const y = cy + (r * 0.6) * Math.sin(theta + angle);
          if (t === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        angle += 0.01;
      }
      setInterval(renderFrame, 30);
    }

    function filterPapers() {
      const q = (document.getElementById('search').value || '').toLowerCase().trim();
      const mq = (document.getElementById('math-search').value || '').toLowerCase().trim();
      const terms = q.split(/\s+/).filter(t => t.length > 0);

      const filtered = papers.filter(p => {
        const fullText = (p.title + ' ' + (p.abstract || '') + ' ' + (p.circuit || '')).toLowerCase();
        const matchesTerms = terms.length === 0 || terms.every(t => fullText.includes(t));
        const matchesMath = !mq || (p.content && p.content.toLowerCase().includes(mq)) || (p.abstract && p.abstract.toLowerCase().includes(mq));
        return matchesTerms && matchesMath;
      });
      renderListFiltered(filtered);
    }

    function renderListFiltered(paperSubset) {
      const listEl = document.getElementById('paper-list');
      listEl.innerHTML = '';
      paperSubset.forEach(paper => {
        const li = document.createElement('li');
        li.className = 'paper-item';
        li.dataset.num = paper.num;
        li.innerHTML = `<span class="paper-num">Paper #${paper.num}</span><span class="paper-title">${paper.title}</span>`;
        li.addEventListener('click', () => {
          document.querySelectorAll('.paper-item').forEach(el => el.classList.remove('active'));
          li.classList.add('active');
          renderPaper(paper);
        });
        listEl.appendChild(li);
      });
      if (paperSubset.length > 0 && !document.querySelector('.paper-item.active')) {
        listEl.firstChild.classList.add('active');
      }
    }

    document.getElementById('search').addEventListener('input', filterPapers);
    const mathSearchEl = document.getElementById('math-search');
    if (mathSearchEl) {
      mathSearchEl.addEventListener('input', filterPapers);
    }

    initThemeHandler();
    if (papers.length > 0) {
      renderList();
      renderPaper(papers[0]);
    }
  </script>

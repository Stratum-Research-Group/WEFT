[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sula-attention"
version = "0.1.0"
description = "Singlet Uncrossed Linear Attention (SULA): Drop-in O(1) Memory Attention for PyTorch Transformers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Stratum Research Group", email = "research@stratum.org" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["sula"]

[project.urls]
Homepage = "https://github.com/Stratum-Research-Group/WEFT"
Repository = "https://github.com/Stratum-Research-Group/WEFT"

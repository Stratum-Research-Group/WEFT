[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weft"
version = "3.7.0"
description = "WEFT: Windowed Exponentially-decayed Factorized Tensor Attention with Titans Neural Memory, MoE, and MLA"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Stratum Research Group", email = "research@stratum.ai" }
]
keywords = ["deep-learning", "linear-attention", "triton", "titans", "moe", "transformers", "pytorch"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "datasets>=5.2.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "tiktoken>=0.14.0",
    "torch>=2.0.0",
    "transformers>=5.0.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "numpy>=1.20.0",
    "safetensors>=0.4.0",
]
gpu = [
    "triton>=2.1.0",
]

[project.scripts]
weft = "weft.cli:main"

[tool.setuptools.packages.find]
include = ["weft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "verify_*.py"]

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weft"
version = "0.1.0"
description = "Windowed Exponentially-decayed Factorized Tensor Attention Model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=5.2.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "tiktoken>=0.14.0",
    "torch>=2.0.0",
    "transformers>=5.0.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "numpy>=1.20.0",
    "safetensors>=0.4.0",
]
gpu = [
    "triton>=2.1.0",
]

[tool.setuptools.packages.find]
include = ["weft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "verify_*.py"]
